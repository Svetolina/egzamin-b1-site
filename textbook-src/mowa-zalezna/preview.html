<style>
/* Layout: одна колонка карточек, как экран «Грамматика» в макетах для телефона; на широком экране — та же колонка по центру */
:root{
  --bg:#F4F5F2; --card:#FFFFFF; --line:#DDE0DA; --line2:#E4E6E0; --soft:#EEF0EA;
  --ink:#1B2430; --ink2:#2F3A48; --muted:#5B6572;

  --ok-bg:#E1F0E8; --ok-ink:#14513A; --mark-bg:#F9EEDA; --mark-ink:#6B4A0E; --mark-line:#E6CF9F;
  --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-pl:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181D; --card:#1C2128; --line:#2C333C; --line2:#262C34; --soft:#232931;
  --ink:#E8EBEE; --ink2:#CDD3DA; --muted:#98A2AE;
  --accent:#F07186; --accent-bg:#3A1F25; --accent-ink:#F7A9B6;
  --ok-bg:#16302A; --ok-ink:#8FD3B4; --mark-bg:#33291A; --mark-ink:#EBCB8E; --mark-line:#5A4825;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181D; --card:#1C2128; --line:#2C333C; --line2:#262C34; --soft:#232931;
  --ink:#E8EBEE; --ink2:#CDD3DA; --muted:#98A2AE;
  --accent:#F07186; --accent-bg:#3A1F25; --accent-ink:#F7A9B6;
  --ok-bg:#16302A; --ok-ink:#8FD3B4; --mark-bg:#33291A; --mark-ink:#EBCB8E; --mark-line:#5A4825;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pl{font-family:var(--f-pl)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.crumb{font-size:13px;color:var(--muted);font-weight:600}
.badge{font-size:13px;font-weight:700;padding:5px 12px;border-radius:14px;background:var(--accent-bg);color:var(--accent-ink)}
h1{font-family:var(--f-pl);font-size:38px;font-weight:600;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.sub{font-size:17px;color:var(--muted);margin-top:2px}
.lead{color:var(--ink2);margin:8px 0 0;max-width:62ch}
.draft{font-size:13px;color:var(--mark-ink);background:var(--mark-bg);border:1px solid var(--mark-line);border-radius:12px;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:17px;font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
.card p{margin:0;color:var(--ink2)}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px 6px;vertical-align:bottom}
td{padding:9px 6px;border-top:1px solid var(--line2);vertical-align:top}
td.pl{font-size:17px}
td.lab{color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.ex{display:flex;flex-direction:column}
.ex>div{padding:9px 0;border-top:1px solid var(--line2)}
.ex>div:first-child{border-top:0;padding-top:0}
.ex .pl{font-size:19px;line-height:1.35}
.ex .ru{font-size:14px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-family:var(--f-pl);font-size:17px;padding:5px 12px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.note{font-size:15px;border-radius:12px;padding:10px 12px;line-height:1.45}
.note.tip{background:var(--soft);color:var(--ink2)}
.note.mark{background:var(--mark-bg);color:var(--mark-ink);border:1px solid var(--mark-line)}
.note.mark b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.fix{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 10px;align-items:baseline}
.bad{font-family:var(--f-pl);font-size:18px;color:var(--accent-ink);text-decoration:line-through;text-decoration-thickness:1.5px}
.good{font-family:var(--f-pl);font-size:18px;color:var(--ok-ink);font-weight:600}
.arr{color:var(--muted)}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}

.hl{color:var(--accent);font-weight:700}
details{border-top:1px solid var(--line2);margin:0 -16px -14px;padding:0 16px}
summary{min-height:44px;display:flex;align-items:center;font-size:13px;color:var(--muted);font-weight:600;cursor:pointer}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
details ul{margin:0 0 12px;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.55;display:flex;flex-direction:column;gap:4px}
details a{color:inherit;overflow-wrap:anywhere}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.exh{font-family:var(--f-pl);font-size:28px;font-weight:600;margin:12px 0 0}
.lvl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.it{border-top:1px solid var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.it:first-of-type{border-top:0;padding-top:0}
.q{font-family:var(--f-pl);font-size:19px;line-height:1.4}
.q .bold{color:var(--accent-ink);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 180px;min-width:0;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--f-pl);font-size:18px;padding:0 12px}
.row input:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font:700 15px var(--f-ui);cursor:pointer}
.opt{min-height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--f-pl);font-size:18px;cursor:pointer}
.opt.ok,.row input.ok{border-color:var(--ok-ink);background:var(--ok-bg);color:var(--ok-ink)}
.opt.no,.row input.no{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink)}
.fb{font-size:14.5px;border-radius:10px;padding:9px 12px;line-height:1.45}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink)}
.fb.no{background:var(--accent-bg);color:var(--accent-ink)}
.fb.dia{background:var(--mark-bg);color:var(--mark-ink)}
.fb a{color:inherit;font-weight:700}
.score{font-size:14px;color:var(--muted);font-weight:600}
.passage{font-size:18px;line-height:1.7;background:var(--soft);border-radius:12px;padding:12px 14px}
.gap{color:var(--accent);font-weight:600;white-space:nowrap}
.need{font-size:15px}
textarea{width:100%;box-sizing:border-box;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:18px/1.45 var(--f-pl);padding:10px 12px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost{background:var(--card);color:var(--ink);align-self:flex-start}
.model{font-size:18px;line-height:1.5;border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin-bottom:8px}
ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--ink2)}
ul.check label{display:flex;gap:10px;align-items:flex-start;min-height:32px;cursor:pointer}
ul.check input{flex:none;width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
</style>

<script id="data" type="application/json">{"topic": {"topic": "mowa-zalezna", "level": "B2", "group": "Синтаксис", "title_pl": "Mowa zależna", "title_ru": "Косвенная речь", "lead": "Powiedział, że…, zapytała, czy…, prosił, żebym… Время не сдвигается. Слой B2 поверх B1.", "facts_file": "extract.json", "stage": "теория и упражнения всех ступеней проверены (естественность, ответы одним словом в перефразированиях, тест на пересказ, Morfeusz 0 ошибок) — ждёт проверки пользователем", "markup": "[[…]] — польский текст", "exam_ref": {"id": "EXAM", "refs": ["STD: По стандарту это тема B2: Dz.U. 2025 poz. 217, Zał. 1, Część II, F (B2): 2.2.3 Składnia, lit. f «mowa niezależna i mowa zależna: wykładniki formalne…; zamiana mowy niezależnej na mowę zależną (np.: Mama powiedziała: Idź po zakupy! / Mama powiedziała, żebym poszedł po zakupy.)», s. 92. На B1 нужны только союзы że, żeby (2.2.3 pkt 3 lit. b, s. 78).", "KEY: экзамен 05.2021, Gramatyka II. «Союзы» (tests/b1-2021-05.js, g2)", "KEY: образец 2019, Gramatyka II. «Союзы» (tests/b1-2019.js, g2)"]}, "forms": [], "theory": [{"id": "t1", "title": "Что такое mowa zależna", "facts": ["R1"], "blocks": [{"type": "p", "text": "Mowa niezależna — цитата: [[Ewa powiedziała: „Jestem zmęczona”.]] Mowa zależna — пересказ: [[Ewa powiedziała, że jest zmęczona.]] Связка зависит от типа фразы:"}, {"type": "table", "head": ["Исходная фраза", "Связка", "Пересказ"], "rows": [["утверждение: «Jestem zmęczona.»", "że", "Powiedziała, że jest zmęczona."], ["вопрос да/нет: «Masz czas?»", "czy", "Zapytała, czy mam czas."], ["вопрос со словом: «Gdzie mieszkasz?»", "gdzie, kiedy, co…", "Zapytała, gdzie mieszkam."], ["просьба/приказ: «Zadzwoń!»", "żeby + окончание", "Poprosiła, żebym zadzwonił."]], "pl_cols": [2]}]}, {"id": "t2", "title": "Время не сдвигается", "facts": ["R2"], "blocks": [{"type": "p", "text": "В отличие от английского, время остаётся тем же, что в исходной фразе — как и в русском («он сказал, что болеет»)."}, {"type": "ex", "items": [{"pl": "Jan (wczoraj): „Jestem chory.” → Jan powiedział, że jest chory.", "ru": "Ян сказал, что болеет."}, {"pl": "Ola: „Kiedy wyjeżdżasz?” → Ola zapytała mnie, kiedy wyjeżdżam.", "ru": "Ола спросила, когда я уезжаю."}]}, {"type": "note", "kind": "tip", "text": "Ошибка по образцу английского: [[Jan powiedział, że był chory]] (так можно, только если он сказал «Byłem chory»)."}]}, {"id": "t3", "title": "Меняются лицо и местоимения", "facts": ["R3", "R10"], "blocks": [{"type": "p", "text": "Пересказываем со своей точки зрения: кто «я», кто «ты»."}, {"type": "table", "head": ["Сказали", "Пересказ"], "rows": [["Ewa do mnie: „Widziałam cię w kinie.”", "Ewa powiedziała, że widziała mnie w kinie."], ["Marek: „Mój brat jest lekarzem.”", "Marek powiedział, że jego brat jest lekarzem."], ["Kasjerka do mnie: „Ma pani drobne?”", "Kasjerka zapytała, czy mam drobne."]], "pl_cols": [0, 1]}, {"type": "note", "kind": "tip", "text": "Слова времени и места (jutro, tu) тоже пересчитываются, если пересказ идёт в другой день или в другом месте: tu → tam, jutro → następnego dnia (правило из одного источника)."}, {"type": "note", "kind": "mark", "text": "Правило подтверждено одним источником — дано одной строкой с пометкой."}], "marked": true}, {"id": "t4", "title": "Вопросы: czy и вопросительные слова", "facts": ["R4", "R5"], "blocks": [{"type": "p", "text": "Вопрос «да/нет» — всегда с **czy** (его нельзя опустить). Вопрос со словом — это слово остаётся, порядок слов обычный."}, {"type": "ex", "items": [{"pl": "„Napisałeś wypracowanie?” → Spytał mnie, czy napisałem wypracowanie.", "ru": "Спросил, написал ли я сочинение."}, {"pl": "„Gdzie mieszkasz?” → Spytała, gdzie mieszkam.", "ru": "Спросила, где я живу."}]}]}, {"id": "t5", "title": "Просьбы и приказы: żeby", "facts": ["R6"], "blocks": [{"type": "p", "text": "Повелительное наклонение → **żeby + окончание + форма на -ł** (тема 11). В официальной речи — aby."}, {"type": "ex", "items": [{"pl": "„Posprzątaj pokój!” → Mama powiedziała mi, żebym posprzątała pokój.", "ru": "Мама сказала, чтобы я убрала комнату."}, {"pl": "„Proszę nie palić.” → Lekarz powiedział, żeby nie palił.", "ru": "Врач сказал ему не курить."}]}]}, {"id": "t6", "title": "Глаголы речи и их падежи", "facts": ["R9"], "blocks": [{"type": "table", "head": ["Глагол", "Падеж лица", "Пример"], "rows": [["powiedzieć / mówić", "komu? — celownik", "Powiedział nam, że…"], ["zapytać / spytać", "kogo? — biernik", "Zapytała mnie, czy…"], ["poprosić / prosić", "kogo? — biernik", "Poprosiła mnie, żebym…"]], "pl_cols": [0, 1, 2]}, {"type": "note", "kind": "tip", "text": "Как в русском: «спросил меня», «попросил меня», но «сказал мне»."}]}, {"id": "t7", "title": "Пунктуация и что пропадает", "facts": ["R7", "R8"], "blocks": [{"type": "p", "text": "Кавычки, двоеточие и тире исчезают; перед связкой — **запятая**. Восклицания и междометия ([[Ojej! No wiesz!]]) при пересказе опускаются."}]}, {"id": "t8", "title": "На экзамене", "facts": ["EXAM"], "blocks": [{"type": "p", "text": "Отдельного задания на косвенную речь в экзамене B1 нет (поиск по сборнику и 18 экзаменам на сайте). Но союзы [[że, czy, żeby]] из этой темы — частые ответы в задании II «союзы» (например, 05.2021: że, czy; образец 2019: że, czy, żeby), а пересказ нужен в письме и в устной части."}, {"type": "steps", "items": ["Утверждение — [[że]], вопрос «да / нет» — [[czy]], другие вопросы — то же слово ([[gdzie, kiedy]]).", "Просьба и приказ — [[żeby]] + форма на -ł.", "Время не сдвигается; меняются «я / ты» и местоимения."]}]}], "exercises": [{"id": "e1", "title": "Какая связка?", "instr": "Впишите że, czy, żeby (с окончанием) или вопросительное слово.", "level": 2, "kind": "type", "items": [{"q": "Ewa: «Jestem zmęczona.» → Ewa powiedziała, ___ jest zmęczona.", "a": ["że"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "Marek do mnie: «Pójdziesz ze mną do kina?» → Marek zapytał mnie, ___ pójdę z nim do kina.", "a": ["czy"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "Mama do mnie: «Wynieś śmieci!» → Mama poprosiła mnie, ___ wyniosła śmieci.", "a": ["żebym", "abym"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "Turysta: «Gdzie jest dworzec?» → Turysta zapytał, ___ jest dworzec.", "a": ["gdzie"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "Szef do nas: «Kiedy skończycie raport?» → Szef zapytał, ___ skończymy raport.", "a": ["kiedy"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "Lekarz do pacjenta: «Proszę dużo pić.» → Lekarz powiedział pacjentowi, ___ dużo pił.", "a": ["żeby", "aby"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "Ania do mnie: «Masz czas?» → Ania zapytała, ___ mam czas.", "a": ["czy"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "Piotr: «Wrócę o szóstej.» → Piotr powiedział, ___ wróci o szóstej.", "a": ["że"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "Sąsiad do mnie: «Dlaczego nie odpowiadasz?» → Sąsiad zapytał, ___ nie odpowiadam.", "a": ["dlaczego", "czemu"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "Nauczycielka do nas: «Otwórzcie okna!» → Nauczycielka powiedziała, ___ otworzyli okna.", "a": ["żebyśmy", "abyśm elownik), zapytać / spytać kogoś (biernik), poprosić kogoś (biernik)…", "t": "t6"}, {"q": "Anna: «Mój pies jest chory.» → Anna powiedziała, że ___ pies jest chory.", "a": ["jej"], "expl": "Управление глаголов речи: powiedzieć komuś (celownik), zapytać / spytać kogoś (biernik), poprosić kogoś (biernik)…", "t": "t6"}, {"q": "Marek do mnie: «Twój samochód stoi na moim miejscu.» → Marek powiedział, że ___ samochód stoi na … miejscu.", "a": ["mój"], "expl": "Управление глаголов речи: powiedzieć komuś (celownik), zapytać / spytać kogoś (biernik), poprosić kogoś (biernik)…", "t": "t6"}, {"q": "Marek do mnie: «Twój samochód stoi na moim miejscu.» → Marek powiedział, że … samochód stoi na ___ miejscu.", "a": ["jego"], "expl": "Управление глаголов речи: powiedzieć komuś (celownik), zapytać / spytać kogoś (biernik), poprosić kogoś (biernik)…", "t": "t6"}, {"q": "Ja do Ewy: «Czy mogę wziąć twój rower?» → Zapytałem Ewę, czy mogę wziąć ___ rower.", "a": ["jej"], "expl": "Управление глаголов речи: powiedzieć komuś (celownik), zapytać / spytać kogoś (biernik), poprosić kogoś (biernik)…", "t": "t6"}, {"q": "Mama zapytała ___ (wy), co chcecie na obiad.", "a": ["was"], "expl": "Управление глаголов речи: powiedzieć komuś (celownik), zapytać / spytać kogoś (biernik), poprosić kogoś (biernik)…", "t": "t6"}, {"q": "Pani Nowak, gdzie pani mieszka? → Zapytaliśmy ___ (pani) Nowak, gdzie mieszka.", "a": ["panią"], "expl": "zapytać kogo? — biernik: pani → panią.", "t": "t6"}, {"q": "Napisz ___ (rodzice), że wszystko w porządku.", "a": ["rodzicom"], "expl": "Управление глаголов речи: powiedzieć komuś (celownik), zapytać / spytać kogoś (biernik), poprosić kogoś (biernik)…", "t": "t6"}, {"q": "Poprosiłam ___ (sąsiad), żeby podlał kwiaty.", "a": ["sąsiada"], "expl": "Управление глаголов речи: powiedzieć komuś (celownik), zapytać / spytać kogoś (biernik), poprosić kogoś (biernik)…", "t": "t6"}]}, {"id": "e7", "title": "Тест в формате экзамена: записка", "instr": "Odebrałaś telefon do współlokatorki Kasi. Uzupełnij wiadomość dla niej: wpisz że / czy / żeby (z końcówką) / zaimek pytający i czasownik w odpowiedniej formie. W nawiasie — co powiedziała pani Kowalska z biura podróży.", "format": "exam", "level": 3, "kind": "text", "passage": "(«Bilety pani Kasi są już gotowe.») Kasiu, dzwoniła pani Kowalska. Powiedziała, {1} Twoje bilety do Rzymu {2} już gotowe. («Czy może pani odebrać je w piątek?») Zapytała, {3} {4} je odebrać w piątek. («Proszę do mnie zadzwonić przed południem.») Prosiła, {5} do niej {6} przed południem. («Kiedy pani wraca z Rzymu?») Zapytała też, {7} {8} z Rzymu. («Hotel ma bardzo dobre opinie.») Powiedziała, {9} hotel {10} bardzo dobre opinie. («Niech pani nie zapomni paszportu!») Prosiła, {11} nie {12} paszportu. («Będę w biurze do osiemnastej.») Dodała, {13} {14} w biurze do osiemnastej. («Czy chce pani ubezpieczenie?») Zapytała jeszcze, {15} {16} ubezpieczenie. Ola", "items": [{"q": "…", "a": ["że"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "…", "a": ["są"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "…", "a": ["czy"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "…", "a": ["możesz"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "…", "a": ["żebyś", "abyś"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "…", "a": ["zadzwoniła"], "expl": "Четыре типа: утверждение → że; вопрос «да/нет» → czy; вопрос с вопросительным словом → то же слово (gdzie, kiedy, co…)…", "t": "t1"}, {"q": "…", "a": ["kiedy"], "expl": "Четыре типа: утвержде : "t2"}, {"q": "Ewa do mnie: «Czy lubisz pływać?» → Ewa zapytała mnie, ___ lubię pływać.", "a": ["czy"], "expl": "Вопрос «да/нет» → czy.", "t": "t4"}, {"q": "Szef do nas: «Przyjdźcie jutro o ósmej!» → Szef powiedział nam, ___ przyszli jutro o ósmej.", "a": ["żebyśmy", "abyśmy"], "expl": "Просьба к «нам»: żeby + окончание -śmy: żebyśmy.", "t": "t5"}, {"q": "Turystka do mnie: «Gdzie mogę kupić bilet?» → Turystka zapytała mnie, gdzie ___ kupić bilet.", "a": ["może"], "expl": "Меняется лицо: mogę → może.", "t": "t3"}, {"q": "Mama do mnie (я — ж.): «Nie wracaj późno!» → Mama poprosiła mnie, żebym nie ___ późno.", "a": ["wracała"], "expl": "Просьба: żeby + форма на -ł: żebym nie wracała.", "t": "t5"}, {"q": "Anna do Piotra: «Kiedy się spotkamy?» → Anna zapytała Piotra, kiedy się ___.", "a": ["spotkają"], "expl": "Меняется лицо: spotkamy → spotkają.", "t": "t3"}, {"q": "Kolega do mnie: «Pożyczysz mi samochód?» → Kolega zapytał mnie, czy ___ mu samochód.", "a": ["pożyczę"], "expl": "czy + лицо по смыслу: pożyczysz → pożyczę.", "t": "t4"}, {"q": "Lekarz: «Pacjent musi zostać w szpitalu.» → Lekarz powiedział, ___ pacjent musi zostać w szpitalu.", "a": ["że"], "expl": "Утверждение передаём через że.", "t": "t1"}]}, {"id": "e9", "level": 4, "kind": "write", "title": "Пересказ разговора (письмо другу)", "instr": "Napisz e-mail do przyjaciela (80–100 słów). Wczoraj rozmawiałeś/rozmawiałaś z nowym sąsiadem. Opowiedz: co sąsiad powiedział o sobie, o co Cię zapytał, o co Cię poprosił i co mu odpowiedziałeś/odpowiedziałaś.", "words": [80, 100], "need": "Не меньше 2 утверждений с że, вопрос с czy и вопрос с вопросительным словом, просьба с żeby; время не сдвинуто, без кавычек.", "model": "Cześć Marek!\nWczoraj poznałam nowego sąsiada. Ma na imię Piotr. Powiedział, że jest informatykiem i pracuje w dużej firmie w centrum. Opowiedział też, że ma psa i dwoje dzieci. Zapytał mnie, czy długo tu mieszkam i gdzie jest najbliższy sklep. Odpowiedziałam, że mieszkam tu od trzech lat, a sklep jest za rogiem. Potem zapytał, kiedy przyjeżdża śmieciarka. Na koniec poprosił mnie, żebym podlewała jego kwiaty, kiedy wyjedzie na urlop. Powiedziałam, że chętnie mu pomogę. Wydaje się bardzo miły!\nPozdrawiam,\nAnia", "model_future": ["powiedział, że", "zapytał mnie, czy", "gdzie jest", "kiedy przyjeżdża", "poprosił mnie, żebym", "odpowiedziałam, że"], "checklist": ["не меньше 2 утверждений с że", "1 вопрос с czy и 1 — с вопросительным словом", "1 просьба с żeby", "время в пересказе не сдвинуто", "без кавычек"], "t": "t1", "items": []}, {"id": "e10", "level": 4, "kind": "write", "title": "Сообщение коллеге о звонке клиента", "instr": "Napisz wiadomość do kolegi z pracy (50–70 słów). Dzwonił do niego klient, pan Nowak. Przekaż: kim jest i co powiedział, o co pytał, o co prosił, kiedy można do niego oddzwonić.", "words": [50, 70], "need": "Kto dzwonił i co powiedział (że), o co pytał (czy / kiedy), o co prosił (żebyś); правильные падежи после powiedzieć / zapytać.", "model": "Cześć Tomek,\ndzwonił do Ciebie pan Nowak z firmy Delta. Powiedział, że jest Twoim nowym klientem i że wysłał Ci wczoraj zamówienie. Pytał, czy już je dostałeś i kiedy może dostać fakturę. Prosił, żebyś do niego oddzwonił jeszcze dzisiaj. Powiedział mi, że będzie w biurze do szesnastej. Jego numer masz w mailu.\nPozdrawiam,\nKasia", "model_future": ["powiedział, że", "pytał, czy", "kiedy może", "prosił, żebyś", "powiedział mi"], "checklist": ["Dzwonił pan Nowak. Powiedział, że…", "Pytał, czy / kiedy…", "Prosił, żebyś…", "правильные падежи: powiedział mi, pytał mnie", "50–70 слов"], "t": "t1", "items": []}]}, "facts": {"R1": {"refs": ["XXA (разделы о zdaniach oznajmujących, pytających i rozkazujących)", "XXB (пункты 1–4)", "ELA («Polish reported speech at a glance»)", "PO s. 192 («Mowa zależna to niedokładne relacjonowanie cudzych (albo swoich) słów w zdaniach podrzędnych»: że — informacje, czy — pytania, żeby — prośby, polecenia)", "PO s. 194 (рамка: kto, co, czy, jak długo, gdzie… że, żeby)"], " <script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const T = D.topic, F = D.facts, SRC = D.sources;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // [[…]] — польский текст, **…** — выделение
  const rich = s => esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="pl">$1</span>').replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s;)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  // раскрыть сокращения источников (PO, JPBG…) один раз на раздел
  const abbr = Object.keys(SRC);
  function refsFor(ids){
    const out = [], used = new Set();
    ids.forEach(id => {
      const refs = id === 'EXAM' ? T.exam_ref.refs : (F[id] ? F[id].refs : []);
      refs.forEach(r => { out.push(r); abbr.forEach(a => { if (new RegExp('(^|[^A-ZŁ])'+a+'([^A-ZŁ]|$)').test(r)) used.add(a); }); });
    });
    const legend = [...used].map(a => '<b>'+a+'</b> — '+SRC[a]);
    return {out, legend};
  }
  const block = b => {
    switch(b.type){
      case 'p': return '<p>'+rich(b.text)+'</p>';
      case 'note': return b.kind === 'mark'
        ? '<div class="note mark"><b>С пометкой</b>'+rich(b.text)+'</div>'
        : '<div class="note tip">'+rich(b.text)+'</div>';
      case 'chips': return '<div class="chips">'+b.items.map(i=>'<span>'+esc(i)+'</span>').join('')+'</div>';
      case 'ex': return '<div class="ex">'+b.items.map(i=>'<div><div class="pl">'+esc(i.pl)+'</div><div class="ru">'+esc(i.ru)+'</div></div>').join('')+'</div>';
      case 'fix': return '<div class="fix">'+b.items.map(i=>'<span class="bad">'+esc(i.bad)+'</span><span class="arr" aria-hidden="true">→</span><span class="good">'+esc(i.good)+'</span>').join('')+'</div>';
      case 'steps': return '<ol class="steps">'+b.items.map(i=>'<li>'+rich(i)+'</li>').join('')+'</ol>';
      case 'table': {
        const pc = new Set(b.pl_cols || []);
        const head = b.head.some(h=>h) ? '<thead><tr>'+b.head.map(h=>'<th>'+rich(h)+'</th>').join('')+'</tr></thead>' : '';
        const rows = b.rows.map(r=>'<tr>'+r.map((c,i)=>{
          const lab = i===0 && b.head[0]==='' ;
          const cls = lab ? 'lab'+(pc.has(i)?' pl':'') : (pc.has(i)?'pl':'');
          return '<td'+(cls?' class="'+cls+'"':'')+'>'+(pc.has(i)?esc(c.replace(/\[\[|\]\]/g,'')):rich(c))+'</td>';
        }).join('')+'</tr>').join('');
        return '<div class="tw"><table>'+head+'<tbody>'+rows+'</tbody></table></div>';
      }
    }
    return '';
  };
  let h = '<div class="top"><span class="crumb">Грамматика · '+esc(T.group)+'</span><span class="badge">'+esc(T.level)+'</span></div>'+
    '<header><h1>'+esc(T.title_pl)+'</h1><div class="sub">'+esc(T.title_ru)+'</div><p class="lead">'+esc(T.lead)+'</p></header>'+
    '<div class="draft">Черновик: '+esc(T.stage)+'. Источники — под каждым разделом теории.</div>';
  T.theory.forEach(sec => {
    const r = refsFor(sec.facts);
    h += '<section class="card" id="'+sec.id+'"><h2>'+rich(sec.title)+'</h2>'+sec.blocks.map(block).join('')+
      '<details><summary>Источники · '+r.out.length+'</summary><ul>'+r.out.map(x=>'<li>'+linkify(x)+'</li>').join('')+
      (r.legend.length?'<li style="list-style:none;margin-left:-18px;margin-top:4px">'+r.legend.map(linkify).join('<br>')+'</li>':'')+'</ul></details></section>';
  });
  const EX = T.exercises || [];
  if (EX.length){
    const LV = {1:'Узнать',2:'Образовать',3:'Применить',4:'Свой текст'};
    h += '<h2 class="exh" id="ex">Упражнения</h2>';
    EX.forEach(e => {
      h += '<section class="card" id="'+e.id+'"><div class="lvl">Ступень '+e.level+' · '+LV[e.level]+(e.format==='exam'?' · формат экзамена':'')+'</div><h2>'+(e.kind==='text'||e.kind==='write'?'<span class="pl">'+esc(e.title)+'</span>':esc(e.title))+'</h2>'+
        (e.instr?'<p>'+esc(e.instr)+'</p>':'');
      if (e.kind==='write'){
        h += '<p class="need">'+esc(e.need)+' Объём: '+e.words[0]+'–'+e.words[1]+' слов.</p>'+
          '<textarea id="w-'+e.id+'" lang="pl" spellcheck="false" rows="6" aria-label="Ваш текст"></textarea>'+
          '<div class="score" id="wc-'+e.id+'">0 слов</div>'+
          '<button type="button" class="btn ghost" data-show="'+e.id+'">Показать образец и чек-лист</button>'+
          '<div id="m-'+e.id+'" hidden><div class="model pl">'+esc(e.model)+'</div>'+
          '<p class="score">Нужные формы в образце: <span class="pl">'+e.model_future.map(esc).join(', ')+'</span></p>'+
          '<ul class="check">'+e.checklist.map((c,i)=>'<li><label><input type="checkbox" id="c-'+e.id+'-'+i+'"> '+esc(c)+'</label></li>').join('')+'</ul></div></section>';
        return;
      }
      if (e.kind==='text') h += '<div class="passage pl">'+esc(e.passage).replace(/\{(\d+)\}/g,'<span class="gap">($1)&nbsp;____</span>')+'</div>';
      h += e.items.map((it,i)=>{
          const key=e.id+'-'+i;
          const q=e.kind==='text' ? '('+esc(it.q)+')' : esc(it.q).replace(/\*\*(.+?)\*\*/g,'<span class="bold">$1</span>');
          const body = e.kind==='choice'
            ? '<div class="row">'+it.opts.map(o=>'<button type="button" class="opt" data-k="'+key+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>'
            : '<form class="row" data-k="'+key+'"><input id="in-'+key+'" autocomplete="off" autocapitalize="off" spellcheck="false" lang="pl" aria-label="Ответ"><button class="btn">Проверить</button></form>';
          return '<div class="it"><div class="q">'+(i+1)+'. '+q+'</div>'+body+'<div class="fb" id="fb-'+key+'" hidden></div></div>';
        }).join('')+'<div class="score" id="sc-'+e.id+'"></div></section>';
    });
  }
  h += '<p class="foot">Все польские формы проверены Morfeusz 2 · '+esc(D.checked)+'</p>';
  document.getElementById('app').innerHTML = h;
  const items = {}; EX.forEach(e=>(e.items||[]).forEach((it,i)=>items[e.id+'-'+i]={e,it}));
  const norm = v => v.trim().toLowerCase().replace(/\s+/g,' ');
  const plain = v => norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
  const done = {};
  function show(key, ok, dia){
    const {e,it} = items[key], fb = document.getElementById('fb-'+key);
    const more = it.a.length>1 ? ' Подходят: '+it.a.map(esc).join(', ')+'.' : '';
    fb.className = 'fb '+(ok?'ok':(dia?'dia':'no'));
    fb.innerHTML = ok ? 'Верно. '+esc(it.expl)+more
      : dia ? 'Почти: проверьте диакритику (ą, ę, ł, ś, ź, ż…).'
      : 'Нет. Правильно: <span class="pl">'+esc(it.a[0])+'</span>. '+esc(it.expl)+more+' <a href="#'+it.t+'">К правилу</a>';
    fb.hidden = false;
    if (!dia){ done[key]=ok; const n=e.items.length, k=Object.keys(done).filter(x=>x.startsWith(e.id+'-')), r=k.filter(x=>done[x]).length;
      document.getElementById('sc-'+e.id).textContent = 'Отвечено '+k.length+' из '+n+', верно '+r+'.'; }
  }
  document.getElementById('app').addEventListener('input', ev => {
    const t = ev.target; if (t.tagName!=='TEXTAREA') return;
    const id = t.id.slice(2), n = (t.value.match(/[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+/g)||[]).length, e = EX.find(x=>x.id===id);
    document.getElementById('wc-'+id).textContent = n+' слов'+(n<e.words[0]?' · мало':n>e.words[1]?' · много':' · в норме');
  });
  document.getElementById('app').addEventListener('click', ev => {
    const sh = ev.target.closest('[data-show]');
    if (sh){ const m=document.getElementById('m-'+sh.dataset.show); m.hidden=!m.hidden; sh.textContent=m.hidden?'Показать образец и чек-лист':'Скрыть образец'; return; }
    const b = ev.target.closest('.opt'); if (!b) return;
    const key=b.dataset.k, {it}=items[key], ok=it.a.includes(b.dataset.v);
    document.querySelectorAll('.opt[data-k="'+key+'"]').forEach(x=>x.classList.remove('ok','no'));
    b.classList.add(ok?'ok':'no'); show(key, ok, false);
  });
  document.getElementById('app').addEventListener('submit', ev => {
    ev.preventDefault(); const f=ev.target, key=f.dataset.k, inp=f.querySelector('input'), {it}=items[key];
    const v=norm(inp.value); if(!v) return;
    const ok = it.a.some(a=>norm(a)===v), dia = !ok && it.a.some(a=>plain(a)===plain(v));
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no'); show(key, ok, dia);
  });

})();
</script>
