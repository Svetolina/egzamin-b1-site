<style>

}

  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181D; --card:#1C2128; --line:#2C333C; --line2:#262C34; --soft:#232931;
  --ink:#E8EBEE; --ink2:#CDD3DA; --muted:#98A2AE;

  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}

.fb.dia{background:var(--mark-bg);color:var(--mark-ink)}
.fb a{color:inherit;font-weight:700}
.score{font-size:14px;color:var(--muted);font-weight:600}
.passage{font-size:18px;line-height:1.7;background:var(--soft);border-radius:12px;padding:12px 14px}
.gap{color:var(--accent);font-weight:600;white-space:nowrap}

.btn.ghost{background:var(--card);color:var(--ink);align-self:flex-start}
.model{font-size:18px;line-height:1.5;border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin-bottom:8px}

s": [["Chcę kawę.", "Chciałbym / Chciałabym kawę.", "Chciałbym zapytać…"], ["Możesz mi pomóc?", "Mógłbyś / Mogłabyś mi pomóc?", "Czy mógłby pan / mogłaby pani mi pomóc?"], ["Mogę prosić o rachunek?", "Mógłbym / Mogłabym prosić o rachunek?", "Czy nie mógłby pan…? (ещё мягче)"]], "pl_cols": [0, 1]}]}, {"id": "t7", "title": "Если бы: gdyby", "facts": ["R9", "R10", "R16"], "blocks": [{"type": "p", "text": "**gdyby + окончание** (gdybym, gdybyś, gdyby, gdybyśmy, gdybyście) + **форма на -ł**, а в главной части — условное наклонение."}, {"type": "ex", "items": [{"pl": "Gdybym miał czas, poszedłbym na spacer.", "ru": "Если бы у меня было время, я бы пошёл гулять."}, {"pl": "Gdybyśmy mieszkali w Polsce, mówilibyśmy po polsku.", "ru": "Если бы мы жили в Польше, мы бы говорили по-польски."}]}, {"type": "note", "kind": "tip", "text": "В главной части можно добавить необязательное [[to]]: Gdybym miał psa, to bym musiał wcześnie wstawać (по одному источнику)."}, {"type": "note", "kind": "tip", "text": "Внимание: Одно by на часть: не [[gdybym miałbym]], а [[gdybym miał]]. Не [[gdyby będę miał]]."}]}, {"id": "t8", "title": "Реально или нереально: jeśli ↔ gdyby", "facts": ["R11", "R12"], "blocks": [{"type": "p", "text": "Чтобы «превратить» реальное условие в нереальное: [[jeśli → gdyby]], будущее → условное наклонение; и обратно."}, {"type": "table", "head": ["условие", "формула", "пример"], "rows": [["реальное", "jeśli/jeżeli + будущее → будущее", "Jeśli będziesz w Warszawie, wpadniesz do mnie?"], ["нереальное", "gdyby + -ł → условное", "Gdybyś był w Warszawie, wpadłbyś do mnie?"]], "pl_cols": [2]}, {"type": "note", "kind": "tip", "text": "[[Jeśli bym miał…]] бывает в разговорной речи, но в упражнениях принимаем только [[gdyby]]."}]}, {"id": "t9", "title": "Прошлое: «если бы тогда…»", "facts": ["R13"], "blocks": [{"type": "p", "text": "Форма та же, прошлое показывают слова [[wtedy, wczoraj, w zeszłym roku]]: [[Gdybym wtedy wiedział, nie przyszedłbym.]]"}]}, {"id": "t10", "title": "Хочу, чтобы ты…: żeby", "facts": ["R14"], "blocks": [{"type": "p", "text": "Когда хотим или просим, чтобы действие сделал **другой**: **żeby + окончание + форма на -ł**: [[Chcę, żebyś przyszedł. Proszę, żebyście nie palili. Mama chce, żebym zadzwoniła.]]"}, {"type": "note", "kind": "tip", "text": "Если субъект тот же — инфинитив: [[Chcę przyjść.]] Подробно о żeby — в теме о придаточных цели."}]}, {"id": "t11", "title": "Вид и совет", "facts": ["R15", "R17"], "blocks": [{"type": "p", "text": "Условное наклонение есть у обоих видов: [[zrobiłbym]] (результат) / [[robiłbym]] (процесс, повтор). Совет: [[Na twoim miejscu nie martwiłbym się tym.]]"}]}, {"id": "t12", "title": "На экзамене", "facts": ["EXAM"], "blocks": [{"type": "p", "text": "Условному наклонению в сборнике посвящён целый блок 9 (зад. I–V: формы, gdyby, перефразирование) и задание IX блока 12. В реальных экзаменах оно встречается в задании VII «вид и наклонение» (например, 06.2022: spróbowalibyśmy, byłoby)."}, {"type": "steps", "items": ["Возьмите форму прошедшего времени нужного рода: [[mógł, mogła, mogli]].", "Добавьте [[by]] и окончание лица: [[mógłbym, mogłabyś, moglibyśmy]].", "Нереальное условие — [[gdyby]], реальное — [[jeśli / jeżeli]] с обычным временем."]}]}], "exercises": [{"id": "e1", "title": "Образуйте форму", "instr": "Напишите форму условного наклонения.", "level": 2, "kind": "type", "items": [{"q": "(ja ♂, robić) → ?", "a": ["robiłbym"], "expl": "Образование: форма прошедшего времени 3 лица (robił, robiła, robiło, robili, robiły) + by + личное окончание -m, -ś, —…", "t": "t2"}, {"q": "(ja ♀, robić) → ?", "a": ["robiłabym"], "expl": "Род различается, как в прошедшем: ja ♂ czytałbym / ja ♀ czytałabym; мн.", "t": "t3"}, {"q": "(ty ♂, mieć) → ?", "a": ["miałbyś"], "expl": "Образование: форма прошедшего времени 3 лица (robił, robiła, robiło, robili, robiły) + by + личное окончание -m, -ś, —…", "t": "t2"}, {"q": "(ty ♀, mieć) → ?", "a": ["miałabyś"], "expl": "Род различается, как в прошедшем: ja е: Na twoim miejscu nie martwiłbym się tym.", "t": "t11"}]}, {"id": "e4", "title": "Jeśli ↔ gdyby", "instr": "Превратите реальное условие в нереальное и наоборот.", "level": 2, "kind": "type", "items": [{"q": "Jeśli będziesz w Warszawie, wpadniesz do mnie? → ___ był w Warszawie, wpadłbyś do mnie?", "a": ["Gdybyś"], "expl": "Реальное условие: jeśli / jeżeli + будущее (или настоящее), в главной части — будущее: Jeśli zdasz egzamin, pójdziemy…", "t": "t8"}, {"q": "Jeśli zdasz egzamin, pójdziemy to uczcić. → Gdybyś zdał egzamin, ___ to uczcić. (my ♂)", "a": ["poszlibyśmy"], "expl": "Реальное условие: jeśli / jeżeli + будущее (или настоящее), в главной части — будущее: Jeśli zdasz egzamin, pójdziemy…", "t": "t8"}, {"q": "Gdybym miał czas, pomógłbym ci. → Jeśli będę ___ czas, pomogę ci. (ja)", "a": ["miał", "mieć", "miała"], "expl": "Реальное условие: jeśli + будущее время (będę miał / miała / mieć).", "t": "t8"}, {"q": "Gdyby padało, zostalibyśmy w domu. → Jeśli będzie padać, ___ w domu. (my)", "a": ["zostaniemy"], "expl": "Реальное условие: jeśli / jeżeli + будущее (или настоящее), в главной части — будущее: Jeśli zdasz egzamin, pójdziemy…", "t": "t8"}, {"q": "Jeśli przyjdziesz, ugotuję obiad. → Gdybyś przyszedł, ___ obiad. (ja ♀)", "a": ["ugotowałabym"], "expl": "Реальное условие: jeśli / jeżeli + будущее (или настоящее), в главной части — будущее: Jeśli zdasz egzamin, pójdziemy…", "t": "t8"}, {"q": "Gdybyś poznał Ewę, polubiłbyś ją. → Jeśli ___ Ewę, polubisz ją.", "a": ["poznasz"], "expl": "Реальное условие: jeśli / jeżeli + будущее (или настоящее), в главной части — будущее: Jeśli zdasz egzamin, pójdziemy…", "t": "t8"}, {"q": "Jeśli kupimy bilety, pojedziemy na koncert. → Gdybyśmy ___ bilety, pojechalibyśmy na koncert. (my ♂)", "a": ["kupili"], "expl": "Реальное условие: jeśli / jeżeli + будущее (или настоящее), в главной части — будущее: Jeśli zdasz egzamin, pójdziemy…", "t": "t8"}, {"q": "Gdyby autobus nie przyjechał, wzięłabym taksówkę. → Jeśli autobus nie przyjed bym wdzięczna…", "model": "Szanowni Państwo,\nchciałabym zapisać się na kurs języka polskiego na poziomie B1. Czy mogliby Państwo przesłać mi informacje o terminach zajęć w semestrze zimowym? Najbardziej odpowiadałyby mi zajęcia wieczorem, ponieważ pracuję do siedemnastej. Chciałabym też zapytać o cenę kursu. Interesowałby mnie również kurs online. Czy mogłabym najpierw przyjść na lekcję próbną? Czy byłaby możliwość zapłacenia w dwóch ratach? Byłabym wdzięczna za szybką odpowiedź.\nZ poważaniem\nAnna Kowalenko", "model_future": ["chciałabym", "mogliby", "odpowiadałyby", "byłaby", "byłabym"], "checklist": ["Szanowni Państwo, … / Z poważaniem", "Chciałbym/Chciałabym …", "минимум 2 вежливых вопроса: Czy mogliby Państwo…? Czy byłaby możliwość…?", "Byłbym wdzięczny / Byłabym wdzięczna za…", "60–80 слов"], "t": "t1", "items": []}]}, "facts": {"R1": {"refs": ["ZPA («Tryb przypuszczający»: «wyraża przypuszczenie, opowiada o zdarzeniach, które mogłyby się zdarzyć»)", "PDA («hypothetical situations»)", "ELA (раздел «Uses»)", "PO s. 173 («Trybu warunkowego (przypuszczającego) używamy: gdy wyrażamy swoje przekonania, przypuszczenia i wątpliwości…; gdy wyrażamy prośby…; gdy składamy propozycje…; gdy wyrażamy życzenia»)"], "status": "ok"}, "R2": {"refs": ["ELA («Formation»)", "PDA («Formation»: 3 л. прош. времени + by)", "PDB («Past tense, third person» + «Particle by»)", "WEA («formed from the past tense, by, and the personal ending»)", "GJA («3rd-person past form + by + personal endings»)", "PO s. 173 (таблица: był+bym, był+byś, był+by … byli+byśmy, były+byśmy)", "ZJP s. 29 (таблица: chciałabym / chciałbym, mogłabym / mógłbym)"], "status": "ok"}, "R3": {"refs": ["ELA («Full paradigm»)", "WEA (примеры byłbym/byłabym … byliby/byłyby)", "PO s. 173 (rodzaj męski, żeński, nijaki, męskoosobowy, niemęskoosobowy)", "ZJP s. 29"], "status": "ok"}, "R4": {"refs": ["PDA (замечание: окончание не присоединяется к 1/2 лицу прошедшего)", "PDB («Past tense, third person: on miał, ona miała…»)", .pl/a/aspekt-i-tryb-czasownika/DPyWEtI3p", "GJA": "A Grammar of the Polish Language (grzegorj.smallhost.pl), «Conjugation, part 2» — абзацы «A verb in Polish distinguishes 3 modes…», «Forms of the conditional mode…»: https://grzegorj.smallhost.pl/gram/en/gram06.html", "WEA": "Wikipedia (en): Polish grammar — Verbs / Conditional: https://en.wikipedia.org/wiki/Polish_grammar", "PDA": "Polski Daily, kurs A2.1, lekcja 7 (tryb przypuszczający): https://polskidaily.eu/kurs-a2-1-lekcja-7/", "PDB": "Polski Daily, PDS068: «Tryb przypuszczający: grzeczne prośby i budowa» (PDF): https://www.polskidaily.eu/wp-content/uploads/2020/01/PDS068.pdf", "PDC": "Polski Daily: «Tryb warunkowy — realne i nierealne sytuacje» (PDF, podsumowanie): https://www.polskidaily.eu/wp-content/uploads/2020/05/B-Tryb-warunkowy-realne-i-nierealne-sytuacje.pdf", "PDD": "Polski Daily: «Tryb przypuszczający 1» (PDF, ćwiczenia 1–2 z kluczem): https://www.polskidaily.eu/wp-content/uploads/2019/05/Tryb-przypuszczaj%C4%85cy-1.pdf", "VTA": "Varsity Tutors, Conversational Polish: «Making polite requests»: https://internal.varsitytutors.com/practice/subjects/polish/lessons/making-polite-requests", "KEY": "Официальные ключи комиссии: сборник B1 2017 (tests/b1-sbornik.js) и экзамены 2017–2024 (tests/b1-*.js) — найдено поиском по заданиям раздела Gramatyka", "MORF": "Morfeusz 2 (SGJP) — проверка польских слов скриптом tools/morfeusz_check.py", "JPBG XI": "Język polski bez granic, kl. XI (B2) (файлы проекта kl.-XI-*.pdf)", "PO": "Gramatyka z kulturą. Przez osoby (файлы проекта Gramatyka-z-kultura.-Przez-osoby.-Logo-*.pdf)", "ZJP": "Z językiem polskim każdego dnia – B1, podręcznik (файлы проекта Podręcznik_…B1-*.pdf)", "ZJP Ćw": "Z językiem polskim każdego dnia – B1, ćwiczenia (файл проекта Ćwiczenia_…B1.pdf)"}, "checked": "24.10.2026"}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const T = D.topic, F = D.facts, SRC = D.sources;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // [[…]] — польский текст, **…** — выделение
  const rich = s => esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="pl">$1</span>').replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s;)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  // раскрыть сокращения источников (PO, JPBG…) один раз на раздел
  const abbr = Object.keys(SRC);
  function refsFor(ids){
    const out = [], used = new Set();
    ids.forEach(id => {
      const refs = id === 'EXAM' ? T.exam_ref.refs : (F[id] ? F[id].refs : []);
      refs.forEach(r => { out.push(r); abbr.forEach(a => { if (new RegExp('(^|[^A-ZŁ])'+a+'([^A-ZŁ]|$)').test(r)) used.add(a); }); });
    });
    const legend = [...used].map(a => '<b>'+a+'</b> — '+SRC[a]);
    return {out, legend};
  }
  const block = b => {
    switch(b.type){
      case 'p': return '<p>'+rich(b.text)+'</p>';
      case 'note': return b.kind === 'mark'
        ? '<div class="note mark"><b>С пометкой</b>'+rich(b.text)+'</div>'
        : '<div class="note tip">'+rich(b.text)+'</div>';
      case 'chips': return '<div class="chips">'+b.items.map(i=>'<span>'+esc(i)+'</span>').join('')+'</div>';
      case 'ex': return '<div class="ex">'+b.items.map(i=>'<div><div class="pl">'+esc(i.pl)+'</div><div class="ru">'+esc(i.ru)+'</div></div>').join('')+'</div>';
      case 'fix': return '<div class="fix">'+b.items.map(i=>'<span class="bad">'+esc(i.bad)+'</span><span class="arr" aria-hidden="true">→</span><span class="good">'+esc(i.good)+'</span>').join('')+'</div>';
      case 'steps': return '<ol class="steps">'+b.items.map(i=>'<li>'+rich(i)+'</li>').join('')+'</ol>';
      case 'table': {
        const pc = new Set(b.pl_cols || []);
        const head = b.head.some(h=>h) ? '<thead><tr>'+b.head.map(h=>'<th>'+rich(h)+'</th>').join('')+'</tr></thead>' : '';
        const rows = b.rows.map(r=>'<tr>'+r.map((c,i)=>{
          const lab = i===0 && b.head[0]==='' ;
          const cls = lab ? 'lab'+(pc.has(i)?' pl':'') : (pc.has(i)?'pl':'');
          return '<td'+(cls?' class="'+cls+'"':'')+'>'+(pc.has(i)?esc(c.replace(/\[\[|\]\]/g,'')):rich(c))+'</td>';
        }).join('')+'</tr>').join('');
        return '<div class="tw"><table>'+head+'<tbody>'+rows+'</tbody></table></div>';
      }
    }
    return '';
  };
  let h = '<div class="top"><span class="crumb">Грамматика · '+esc(T.group)+'</span><span class="badge">'+esc(T.level)+'</span></div>'+
    '<header><h1>'+esc(T.title_pl)+'</h1><div class="sub">'+esc(T.title_ru)+'</div><p class="lead">'+esc(T.lead)+'</p></header>'+
    '<div class="draft">Черновик: '+esc(T.stage)+'. Источники — под каждым разделом теории.</div>';
  T.theory.forEach(sec => {
    const r = refsFor(sec.facts);
    h += '<section class="card" id="'+sec.id+'"><h2>'+rich(sec.title)+'</h2>'+sec.blocks.map(block).join('')+
      '<details><summary>Источники · '+r.out.length+'</summary><ul>'+r.out.map(x=>'<li>'+linkify(x)+'</li>').join('')+
      (r.legend.length?'<li style="list-style:none;margin-left:-18px;margin-top:4px">'+r.legend.map(linkify).join('<br>')+'</li>':'')+'</ul></details></section>';
  });
  const EX = T.exercises || [];
  if (EX.length){
    const LV = {1:'Узнать',2:'Образовать',3:'Применить',4:'Свой текст'};
    h += '<h2 class="exh" id="ex">Упражнения</h2>';
    EX.forEach(e => {
      h += '<section class="card" id="'+e.id+'"><div class="lvl">Ступень '+e.level+' · '+LV[e.level]+(e.format==='exam'?' · формат экзамена':'')+'</div><h2>'+(e.kind==='text'||e.kind==='write'?'<span class="pl">'+esc(e.title)+'</span>':esc(e.title))+'</h2>'+
        (e.instr?'<p>'+esc(e.instr)+'</p>':'');
      if (e.kind==='write'){
        h += '<p class="need">'+esc(e.need)+' Объём: '+e.words[0]+'–'+e.words[1]+' слов.</p>'+
          '<textarea id="w-'+e.id+'" lang="pl" spellcheck="false" rows="6" aria-label="Ваш текст"></textarea>'+
          '<div class="score" id="wc-'+e.id+'">0 слов</div>'+
          '<button type="button" class="btn ghost" data-show="'+e.id+'">Показать образец и чек-лист</button>'+
          '<div id="m-'+e.id+'" hidden><div class="model pl">'+esc(e.model)+'</div>'+
          '<p class="score">Нужные формы в образце: <span class="pl">'+e.model_future.map(esc).join(', ')+'</span></p>'+
          '<ul class="check">'+e.checklist.map((c,i)=>'<li><label><input type="checkbox" id="c-'+e.id+'-'+i+'"> '+esc(c)+'</label></li>').join('')+'</ul></div></section>';
        return;
      }
      if (e.kind==='text') h += '<div class="passage pl">'+esc(e.passage).replace(/\{(\d+)\}/g,'<span class="gap">($1)&nbsp;____</span>')+'</div>';
      h += e.items.map((it,i)=>{
          const key=e.id+'-'+i;
          const q=e.kind==='text' ? '('+esc(it.q)+')' : esc(it.q).replace(/\*\*(.+?)\*\*/g,'<span class="bold">$1</span>');
          const body = e.kind==='choice'
            ? '<div class="row">'+it.opts.map(o=>'<button type="button" class="opt" data-k="'+key+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>'
            : '<form class="row" data-k="'+key+'"><input id="in-'+key+'" autocomplete="off" autocapitalize="off" spellcheck="false" lang="pl" aria-label="Ответ"><button class="btn">Проверить</button></form>';
          return '<div class="it"><div class="q">'+(i+1)+'. '+q+'</div>'+body+'<div class="fb" id="fb-'+key+'" hidden></div></div>';
        }).join('')+'<div class="score" id="sc-'+e.id+'"></div></section>';
    });
  }
  h += '<p class="foot">Все польские формы проверены Morfeusz 2 · '+esc(D.checked)+'</p>';
  document.getElementById('app').innerHTML = h;
  const items = {}; EX.forEach(e=>(e.items||[]).forEach((it,i)=>items[e.id+'-'+i]={e,it}));
  const norm = v => v.trim().toLowerCase().replace(/\s+/g,' ');
  const plain = v => norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
  const done = {};
  function show(key, ok, dia){
    const {e,it} = items[key], fb = document.getElementById('fb-'+key);
    const more = it.a.length>1 ? ' Подходят: '+it.a.map(esc).join(', ')+'.' : '';
    fb.className = 'fb '+(ok?'ok':(dia?'dia':'no'));
    fb.innerHTML = ok ? 'Верно. '+esc(it.expl)+more
      : dia ? 'Почти: проверьте диакритику (ą, ę, ł, ś, ź, ż…).'
      : 'Нет. Правильно: <span class="pl">'+esc(it.a[0])+'</span>. '+esc(it.expl)+more+' <a href="#'+it.t+'">К правилу</a>';
    fb.hidden = false;
    if (!dia){ done[key]=ok; const n=e.items.length, k=Object.keys(done).filter(x=>x.startsWith(e.id+'-')), r=k.filter(x=>done[x]).length;
      document.getElementById('sc-'+e.id).textContent = 'Отвечено '+k.length+' из '+n+', верно '+r+'.'; }
  }
  document.getElementById('app').addEventListener('input', ev => {
    const t = ev.target; if (t.tagName!=='TEXTAREA') return;
    const id = t.id.slice(2), n = (t.value.match(/[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+/g)||[]).length, e = EX.find(x=>x.id===id);
    document.getElementById('wc-'+id).textContent = n+' слов'+(n<e.words[0]?' · мало':n>e.words[1]?' · много':' · в норме');
  });
  document.getElementById('app').addEventListener('click', ev => {
    const sh = ev.target.closest('[data-show]');
    if (sh){ const m=document.getElementById('m-'+sh.dataset.show); m.hidden=!m.hidden; sh.textContent=m.hidden?'Показать образец и чек-лист':'Скрыть образец'; return; }
    const b = ev.target.closest('.opt'); if (!b) return;
    const key=b.dataset.k, {it}=items[key], ok=it.a.includes(b.dataset.v);
    document.querySelectorAll('.opt[data-k="'+key+'"]').forEach(x=>x.classList.remove('ok','no'));
    b.classList.add(ok?'ok':'no'); show(key, ok, false);
  });
  document.getElementById('app').addEventListener('submit', ev => {
    ev.preventDefault(); const f=ev.target, key=f.dataset.k, inp=f.querySelector('input'), {it}=items[key];
    const v=norm(inp.value); if(!v) return;
    const ok = it.a.some(a=>norm(a)===v), dia = !ok && it.a.some(a=>plain(a)===plain(v));
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no'); show(key, ok, dia);
  });

})();
</script>
