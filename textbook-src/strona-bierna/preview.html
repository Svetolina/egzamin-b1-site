<style>

:root{

  --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-pl:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181D; --card:#1C2128; --line:#2C333C; --line2:#262C34; --soft:#232931;
  --ink:#E8EBEE; --ink2:#CDD3DA; --muted:#98A2AE;
  --accent:#F07186; --accent-bg:#3A1F25; --accent-ink:#F7A9B6;
  --ok-bg:#16302A; --ok-ink:#8FD3B4; --mark-bg:#33291A; --mark-ink:#EBCB8E; --mark-line:#5A4825;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181D; --card:#1C2128; --line:#2C333C; --line2:#262C34; --soft:#232931;
  --ink:#E8EBEE; --ink2:#CDD3DA; --muted:#98A2AE;
  --accent:#F07186; --accent-bg:#3A1F25; --accent-ink:#F7A9B6;
  --ok-bg:#16302A; --ok-ink:#8FD3B4; --mark-bg:#33291A; --mark-ink:#EBCB8E; --mark-line:#5A4825;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pl{font-family:var(--f-pl)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.crumb{font-size:13px;color:var(--muted);font-weight:600}
.badge{font-size:13px;font-weight:700;padding:5px 12px;border-radius:14px;background:var(--accent-bg);color:var(--accent-ink)}
h1{font-family:var(--f-pl);font-size:38px;font-weight:600;line-height:1.1;margin:2px 0 0;text-wrap:balance}

.lead{color:var(--ink2);margin:8px 0 0;max-width:62ch}
.draft{font-size:13px;color:var(--mark-ink);background:var(--mark-bg);border:1px solid var(--mark-line);border-radius:12px;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.card p{margin:0;color:var(--ink2)}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:15px}

.ex{display:flex;flex-direction:column}
.ex>div{padding:9px 0;border-top:1px solid var(--line2)}
.ex>div:first-child{border-top:0;padding-top:0}
.ex .pl{font-size:19px;line-height:1.35}

.note.tip{background:var(--soft);color:var(--ink2)}
.note.mark{background:var(--mark-bg);color:var(--mark-ink);border:1px solid var(--mark-line)}
.note.mark b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}

.bad{font-family:var(--f-pl);font-size:18px;color:var(--accent-ink);text-decoration:line-through;text-decoration-thickness:1.5px}
.good{font-family:var(--f-pl);font-size:18px;color:var(--ok-ink);font-weight:600}
.arr{color:var(--muted)}

.hl{color:var(--accent);font-weight:700}
details{border-top:1px solid var(--line2);margin:0 -16px -14px;padding:0 16px}

details ul{margin:0 0 12px;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.55;display:flex;flex-direction:column;gap:4px}
details a{color:inherit;overflow-wrap:anywhere}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.exh{font-family:var(--f-pl);font-size:28px;font-weight:600;margin:12px 0 0}
.lvl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.it{border-top:1px solid var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.it:first-of-type{border-top:0;padding-top:0}
.q{font-family:var(--f-pl);font-size:19px;line-height:1.4}

.row{display:flex;gap:8px;flex-wrap:wrap}

.opt.ok,.row input.ok{border-color:var(--ok-ink);background:var(--ok-bg);color:var(--ok-ink)}
.opt.no,.row input.no{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink)}
.fb{font-size:14.5px;border-radius:10px;padding:9px 12px;line-height:1.45}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink)}
.fb.no{background:var(--accent-bg);color:var(--accent-ink)}
.fb.dia{background:var(--mark-bg);color:var(--mark-ink)}
.fb a{color:inherit;font-weight:700}
.score{font-size:14px;color:var(--muted);font-weight:600}
.passage{font-size:18px;line-height:1.7;background:var(--soft);border-radius:12px;padding:12px 14px}
.gap{color:var(--accent);font-weight:600;white-space:nowrap}
.need{font-size:15px}
textarea{width:100%;box-sizing:border-box;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:18px/1.45 var(--f-pl);padding:10px 12px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost{background:var(--card);color:var(--ink);align-self:flex-start}
.model{font-size:18px;line-height:1.5;border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin-bottom:8px}
ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--ink2)}
ul.check label{display:flex;gap:10px;align-items:flex-start;min-height:32px;cursor:pointer}
ul.check input{flex:none;width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
</style>

<script id="data" type="application/json">{"topic": {"topic": "strona-bierna", "level": "B2", "group": "Глагол", "title_pl": "Strona bierna", "title_ru": "Страдательный залог", "lead": "Dom został zbudowany w 1900 roku. Kto? Przez kogo? Слой B2 поверх B1.", "facts_file": "extract.json", "stage": "теория и упражнения всех ступеней проверены (естественность, ответы одним словом в перефразированиях, тест на пересказ, Morfeusz 0 ошибок) — ждёт проверки пользователем", "markup": "[[…]] — польский текст", "exam_ref": {"id": "EXAM", "refs": ["STD: По стандарту это тема B2, не B1: Dz.U. 2025 poz. 217, Zał. 1, Część II, F (B2): 2.2.1 Fleksja, pkt 2 lit. d «strona bierna – w ograniczonym zakresie (np.: Dziecko jest myte przez matkę. Pokój zostanie uporządkowany przez Pawła.)», s. 89; 2.2.3 Składnia, lit. g «synonimia syntaktyczna (… Rachunek, który został zapłacony przez ojca…)», s. 92. В списке B1 (s. 75–78) страдательного залога нет.", "KEY: поиск по разделу Gramatyka сборника 2017 и 18 экзаменов (tests/b1-*.js) — заданий на эту тему нет"]}, "forms": [], "theory": [{"id": "t1", "title": "Что такое strona bierna", "facts": ["R1", "R2", "R12"], "blocks": [{"type": "p", "text": "В действительном залоге подлежащее делает действие: [[Poeta napisał wiersz.]] В страдательном (strona bierna) подлежащее — то, над чем действие совершается: [[Wiersz został napisany przez poetę.]]"}, {"type": "p", "text": "Формула: **być / zostać + imiesłów bierny**. Работает только с переходными глаголами (у которых есть дополнение в bierniku). Пассив — в основном письменный стиль: новости, история, официальные тексты."}, {"type": "ex", "items": [{"pl": "Ten pałac został zbudowany przez króla.", "ru": "Этот дворец был построен королём."}]}]}, {"id": "t2", "title": "Как образовать причастие", "facts": ["R3", "R4", "R5", "R6"], "blocks": [{"type": "p", "text": "Причастие оканчивается на **-ny** или **-ty** и склоняется как прилагательное."}, {"type": "table", "head": ["Инфинитив", "Суффикс", "Примеры"], "rows": [["-ać, -ować", "-any, -owany", "napisać → napisany, zbudować → zbudowany"], ["-ić, -yć, -eć", "-ony (+ чередование)", "zrobić → zrobiony, kupić → kupiony, zaprosić → zaproszony, zapłacić → zapłacony, skończyć → skończony"], ["-nąć, -ąć", "-ęty", "zamknąć → zamknięty, zacząć → zaczęty, wziąć → wzięty"], ["короткие основы", "-ty", "umyć → umyty, użyć → użyty, zepsuć → zepsuty"], ["особая форма", "", "otworzyć → otwarty"]], "pl_cols": [2]}, {"type": "note", "kind": "tip", "text": "Надёжнее всего ориентироваться на основу настоящего/будущего времени: zaproszę → zaproszony."}]}, {"id": "t3", "title": "Согласование и мужско-личная форма", "facts": ["R7"], "blocks": [{"type": "p", "text": "И глагол (został/została…), и причастие согласуются с подлежащим."}, {"type": "table", "head": ["Подлежащее", "Пример"], "rows": [["он (м.)", "list został napisany"], ["она (ж.)", "książka została napisana"], ["оно (ср.)", "zadanie zostało napisane"], ["мужчины / смешанная группа", "studenci zostali wybrani / zaproszeni / umyci"], ["остальные мн. ч.", "listy zostały napisane, drzwi są zamknięte"]], "pl_cols": [1]}, {"type": "note", "kind": "tip", "text": "Мужско-личное мн. ч.: -ny → -ni (wybrani), -ony → -eni (zaproszeni), -ty → -ci (umyci)."}]}, {"id": "t4", "title": "być или zostać?", "facts": ["R8", "R9"], "blocks": [{"type": "p", "text": "Вопрос-проверка: **был ли момент, когда это случилось?** Да (можно добавить дату) → **zostać**. Описываем, как обстоят дела сейчас → **być**."}, {"type": "p", "text": "**być** + причастие несовершенного вида — процесс: [[Muzeum było budowane przez trzy lata.]]"}, {"type": "table", "head": ["zostać — событие", "być — состояние / процесс"], "rows": [["Drzwi zostały zamknięte o ósmej.", "Drzwi są zamknięte."], ["Most został zbudowany w 1990 roku.", "Ten dom jest zbudowany z drewna."], ["Prezydent został wybrany w niedzielę.", "Testy są sprawdzane przez komisję."]], "pl_cols": [0, 1]}, {"type": "note", "kind": "tip", "text": "Ошибка: [[Prezydent był wybrany w niedzielę]] — правильно został wybrany."}]}, {"id": "t5", "title": "Времена", "facts": ["R8", "R9", "R10"], "blocks": [{"type": "p", "text": "У zostać нет настоящего времени: [[zostanie]] — это будущее («будет закрыт»)."}, {"type": "table", "head": ["Время", "być", "zostać"], "rows": [["настоящее", "jest zamknięty / jest budowany", "— (нет)"], ["прошедшее", "był zamknięty / był budowany", "został zamknięty"], ["будущее", "będzie zamknięty / będzie odwiedzany", "zostanie zamknięty"]], "pl_cols": [1]}]}, {"id": "t6", "title": "Кем? — przez + biernik", "facts": ["R11"], "blocks": [{"type": "p", "text": "Исполнитель — **przez + biernik**. Внимание: не творительный падеж, как в русском «написано Пушкиным»."}, {"type": "ex", "items": [{"pl": "List został wysłany przez sekretarkę.", "ru": "Письмо было отправлено секретарём."}, {"pl": "Obraz został namalowany przez Jana Matejkę.", "ru": "Картина была написана Яном Матейко."}]}, {"type": "note", "kind": "tip", "text": "Неверно: [[List został wysłany sekretarką]]."}]}, {"id": "t7", "title": "Как перестроить предложение", "facts": ["R1", "R2", "R11"], "blocks": [{"type": "p", "text": "1. Дополнение в bierniku → подлежащее (в mianowniku). 2. Время и вид исходного глагола → być/zostać в том же времени + причастие. 3. Подлежащее исходного предложения → przez + biernik (можно опустить)."}, {"type": "p", "text": "[[Policja zatrzymała złodzieja.]] → [[Złodziej został zatrzymany przez policję.]]"}]}, {"id": "t8", "title": "Без исполнителя: -no/-to и się", "facts": ["R13", "R14"], "blocks": [{"type": "p", "text": "**-no/-to** ([[zbudowano, otwarto, zamknięto, podpisano]]) — «построили, открыли»: нет подлежащего, исполнителя назвать нельзя, дополнение остаётся в **bierniku**: [[Otwarto nową wystawę.]] Типично для новостей."}, {"type": "p", "text": "**się** — общее действие «у нас так делают»: [[W Polsce dużo się czyta. Tutaj sprzedaje się świeży chleb.]]"}, {"type": "table", "head": ["Пассив", "-no/-to"], "rows": [["Wy żywany)", "хотя бы 1 форма будущего (zostanie odnowiony)", "80–100 слов"], "t": "t4", "items": []}]}, "facts": {"R1": {"refs": ["ZPA (разделы «Strona czynna / bierna», «Budowa»)", "PDA (раздел «Czym jest strona bierna?»: «Ten pałac został zbudowany przez króla…»)", "ELA (вводная часть)", "JPBG XI s. 39 («strona bierna: podmiot jest odbiorcą czynności… W jej skład wchodzą formy osobowe czasowników być lub zostać oraz imiesłów przymiotnikowy bierny»)", "PO s. 204 («W stronie biernej używamy imiesłowów przymiotnikowych biernych…»)"], "status": "ok"}, "R2": {"refs": ["ZPA (разделы «Przekształcanie» и «Które czasowniki»)", "GJA (passive voice: «created almost exclusively by transitive verbs»)", "ZPB («tylko od czasowników przechodnich»)", "JPBG XI s. 39 («Stronę bierną tworzymy tylko od czasowników przechodnich (tranzytywnych)»; «W zdaniach w stronie biernej funkcję podmiotu pełni dopełnienie ze strony czynnej»)"], "status": "ok"}, "R3": {"refs": ["ZPB (раздел о imiesłów przymiotnikowy bierny: «-ny lub -ty», odmiana jak ładny / bogaty)", "ZPC (таблица склонения namalowany; пример robiony / zrobiony)", "WEA (раздел Participles: «passive participle … in -ny or -ty (conjugated as an adjective)»)", "JPBG XI s. 20 («Imiesłów przymiotnikowy bierny tworzy się od czasowników przechodnich zarówno dokonanych, jak i niedokonanych»; -ny, -ony, -ty)"], "status": "ok"}, "R4": {"refs": ["ELB (раздел -any (-ać) и -owany)", "PDA (пример zaprojektować → zaprojektowany)", "ZPB (примеры napisany, karany)", "JPBG XI s. 20 («-ny, -na, -ne»: czyta-ł → czyta-ny, widzia-ł → widzia-ny)"], "status": "ok"}, "R5": {"refs": ["ELB (раздел -ony: zrobiony, kupiony, zobaczony, zaproszony, płacony; чередования ś→sz, ć→c)", "PDA (пример skończyć → skończony)", "ZPC (пример robiony / zrobiony)", "JPBG XI s. 20 («-ony, -ona, -one»: licz-ysz → liczony, zrob-isz → zrobiony, piecz-esz → pieczony)"], "status": "ok"}, "R6": {"refs": ["ELB (раздел -ty)", "PDA (пример użyć → użyty)", "GJA (пример on jest myty)", "JPBG XI s. 20 («-ty, -ta, -te»: zaczę-li → zaczęty, my-li → myty, bi-li → bity)"], "status": "ok"}, "R7": {"refs": ["ELA (раздел Agreement: studenci zostali wybrani)", "ELB (раздел Masculine-personal plural: aresztowani / aresztowane, zaproszeni)", "ZPC (таблица: rodzaj męskoosobowy — namalowani)", "GJA (пример oni są myci)", "JPBG XI s. 21 («Imiesłowy … na -ony w mianowniku l.mn. rodzaju męskoosobowego kończą się na -eni»)", "JPBG XI s. 39 (zostaliśmy przyjęci / zostałyśmy przyjęte; byli witani / były witane)"], "status": "ok"}, "R8": {"refs": ["ELA (разделы «być vs zostać», «Common mistakes»)", "ZPA (раздел «Budowa»: być — stan, zostać — czynność dokonana)", "GJA (passive: perfective verbs form past and future passives with zostać; resultative forms with być)", "JPBG XI s. 39 («czasownik posiłkowy zostać występuje tylko w stronie biernej tworzonej od czasowników dokonanych»; «być niekiedy jest używany … od dokonanych: jestem zaproszony»)", "PO s. 204–205 («form czasownika zostać, jeśli imiesłowy pochodzą od czasowników dokonanych»; упражнение «Być czy zostać?»)"], "status": "ok"}, "R9": {"refs": ["GJA (imperfective verbs: być + participle — on jest myty, ona jest myta)", "PDA (примеры był budowany, jest monitorowany, są śpiewane)", "JPBG XI s. 39 («Stronę bierną od czasowników niedokonanych tworzymy przy pomocy czasownika posiłkowego być: jest czytany… będzie oglądany»)", "PO s. 204 («chętnie była / jest / będzie czytana przez młodzież»)"], "status": "ok"}, "R10": {"refs": ["ELA (раздел Tenses: «zostać has no present tense … present-shaped forms carry future meaning»)", "GJA (resultative forms byłem / jestem / będę umyty; future passive with zostać)", "JPBG XI s. 39–40 (zostanę zatrudniony; «Lekarze przyjmą wszystkich pacjentów → Wszyscy pacjenci zostaną przyjęci przez lekarzy»; będzie oglądany)"], "status": "ok"}, "R11": {"refs": ["ELA (раздел Agent: «przez + accusative, not the instrumental»)", "ZPA (раздел «Przekształcanie»: podmiot → przez + biernik, «przez poetę»)", "GJA (пример Jan jest bity przez Pawła)", "PO s. 204 («W stronie biernej używamy konstrukcji: przez kogo, przez co (przez + biernik)»)", "JPBG XI s. 39 («podmiot ze strony czynnej pełni funkcję dopełnienia wyrażonego w bierniku z przyimkiem przez»)"], "status": "ok"}, "R12": {"refs": ["GJA («characteristic for the written language rather»)", "ELA (раздел «Polish alternatives»)"], "status": "ok"}, "R13": {"refs": ["ELC (раздел -no/-to impersonal past: «keeps the object in the accusative», przez — ungrammatical)", "WEA (раздел Verbs: «subjectless past tense … with the ending -o (e.g. śpiewano)»)", "ZPC (примечание: формы na -no, -to (zamknięto, zbudowano) — nieosobowe, не imiesłowy)", "JPBG XI s. 171 («Formy nieosobowe zakończone na -no, -to … mają znaczenie czasu przeszłego»; «nie zawierają informacji o wykonawcy czynności»)", "PO s. 209 («FORMY NIEOSOBOWE – są zakończone na -no, -to»)"], "status": "ok"}, "R14": {"refs": ["ELC (раздел się-construction)", "WEA (раздел Impersonal sentences: «się but no subject, the verb being third-person singular»)", "ELA (пример Sprzedaje się mieszkanie)", "JPBG XI s. 171–172 («Formy nieosobowe z zaimkiem się tworzymy przez dodanie się do czasownika w 3. osobie liczby pojedynczej»: Dzisiaj czyta się mało gazet)"], "status": "ok"}}, "sources": {"STD": "Dz.U. 2025 poz. 217 (файл проекта D20250217.pdf)", "ZPA": "ZPE (MEN) — «Strona czynna i bierna»: https://zpe.gov.pl/a/strona-czynna-i-bierna/Dbi8lrKg0", "PDA": "Polski Daily — «Klub Gramatyczny: Strona bierna 2» (PDF, 2025): https://polskidaily.eu/wp-content/uploads/2025/06/Klub-Gramatyczny-Strona-bierna-2.pdf", "ELA": "elon.io — «The Passive Voice: być and zostać + Participle»: https://elon.io/grammar/polish/verbs/voice/passive-byc-zostac", "GJA": "G. Jagodziński, «A Grammar of the Polish Language», ч. 7 (Conjugation 2): https://grzegorj.smallhost.pl/gram/en/gram07.html", "ZPB": "ZPE (MEN) — «Imiesłowy i ich rodzaje»: https://zpe.gov.pl/a/imieslowy-i-ich-rodzaje/DN28lvu36", "ZPC": "ZPE (MEN) — «Rodzaje imiesłowów. Imiesłów przymiotnikowy»: https://zpe.gov.pl/watek/LPCgxyBw7p/255/a/rodzaje-imieslowow-imieslow-przymiotnikowy/DgfX2F5qy", "WEA": "Wikipedia (en) — «Polish grammar»: https://en.wikipedia.org/wiki/Polish_grammar", "ELB": "elon.io — «The Passive Participle (-ny / -ty)»: https://elon.io/grammar/polish/verbs/participles/passive-participle", "ELC": "elon.io — «The Full Impersonal/Passive System Compared»: https://elon.io/grammar/polish/complex/se-passive-vs-no-to-vs-zostac", "MORF": "Morfeusz 2 (SGJP) — проверка польских слов скриптом tools/morfeusz_check.py", "JPBG XI": "Język polski bez granic, kl. XI (B2) (файлы проекта kl.-XI-*.pdf)", "PO": "Gramatyka z kulturą. Przez osoby (файлы проекта Gramatyka-z-kultura.-Przez-osoby.-Logo-*.pdf)"}, "checked": "24.10.2026"}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const T = D.topic, F = D.facts, SRC = D.sources;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // [[…]] — польский текст, **…** — выделение
  const rich = s => esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="pl">$1</span>').replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s;)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  // раскрыть сокращения источников (PO, JPBG…) один раз на раздел
  const abbr = Object.keys(SRC);
  function refsFor(ids){
    const out = [], used = new Set();
    ids.forEach(id => {
      const refs = id === 'EXAM' ? T.exam_ref.refs : (F[id] ? F[id].refs : []);
      refs.forEach(r => { out.push(r); abbr.forEach(a => { if (new RegExp('(^|[^A-ZŁ])'+a+'([^A-ZŁ]|$)').test(r)) used.add(a); }); });
    });
    const legend = [...used].map(a => '<b>'+a+'</b> — '+SRC[a]);
    return {out, legend};
  }
  const block = b => {
    switch(b.type){
      case 'p': return '<p>'+rich(b.text)+'</p>';
      case 'note': return b.kind === 'mark'
        ? '<div class="note mark"><b>С пометкой</b>'+rich(b.text)+'</div>'
        : '<div class="note tip">'+rich(b.text)+'</div>';
      case 'chips': return '<div class="chips">'+b.items.map(i=>'<span>'+esc(i)+'</span>').join('')+'</div>';
      case 'ex': return '<div class="ex">'+b.items.map(i=>'<div><div class="pl">'+esc(i.pl)+'</div><div class="ru">'+esc(i.ru)+'</div></div>').join('')+'</div>';
      case 'fix': return '<div class="fix">'+b.items.map(i=>'<span class="bad">'+esc(i.bad)+'</span><span class="arr" aria-hidden="true">→</span><span class="good">'+esc(i.good)+'</span>').join('')+'</div>';
      case 'steps': return '<ol class="steps">'+b.items.map(i=>'<li>'+rich(i)+'</li>').join('')+'</ol>';
      case 'table': {
        const pc = new Set(b.pl_cols || []);
        const head = b.head.some(h=>h) ? '<thead><tr>'+b.head.map(h=>'<th>'+rich(h)+'</th>').join('')+'</tr></thead>' : '';
        const rows = b.rows.map(r=>'<tr>'+r.map((c,i)=>{
          const lab = i===0 && b.head[0]==='' ;
          const cls = lab ? 'lab'+(pc.has(i)?' pl':'') : (pc.has(i)?'pl':'');
          return '<td'+(cls?' class="'+cls+'"':'')+'>'+(pc.has(i)?esc(c.replace(/\[\[|\]\]/g,'')):rich(c))+'</td>';
        }).join('')+'</tr>').join('');
        return '<div class="tw"><table>'+head+'<tbody>'+rows+'</tbody></table></div>';
      }
    }
    return '';
  };
  let h = '<div class="top"><span class="crumb">Грамматика · '+esc(T.group)+'</span><span class="badge">'+esc(T.level)+'</span></div>'+
    '<header><h1>'+esc(T.title_pl)+'</h1><div class="sub">'+esc(T.title_ru)+'</div><p class="lead">'+esc(T.lead)+'</p></header>'+
    '<div class="draft">Черновик: '+esc(T.stage)+'. Источники — под каждым разделом теории.</div>';
  T.theory.forEach(sec => {
    const r = refsFor(sec.facts);
    h += '<section class="card" id="'+sec.id+'"><h2>'+rich(sec.title)+'</h2>'+sec.blocks.map(block).join('')+
      '<details><summary>Источники · '+r.out.length+'</summary><ul>'+r.out.map(x=>'<li>'+linkify(x)+'</li>').join('')+
      (r.legend.length?'<li style="list-style:none;margin-left:-18px;margin-top:4px">'+r.legend.map(linkify).join('<br>')+'</li>':'')+'</ul></details></section>';
  });
  const EX = T.exercises || [];
  if (EX.length){
    const LV = {1:'Узнать',2:'Образовать',3:'Применить',4:'Свой текст'};
    h += '<h2 class="exh" id="ex">Упражнения</h2>';
    EX.forEach(e => {
      h += '<section class="card" id="'+e.id+'"><div class="lvl">Ступень '+e.level+' · '+LV[e.level]+(e.format==='exam'?' · формат экзамена':'')+'</div><h2>'+(e.kind==='text'||e.kind==='write'?'<span class="pl">'+esc(e.title)+'</span>':esc(e.title))+'</h2>'+
        (e.instr?'<p>'+esc(e.instr)+'</p>':'');
      if (e.kind==='write'){
        h += '<p class="need">'+esc(e.need)+' Объём: '+e.words[0]+'–'+e.words[1]+' слов.</p>'+
          '<textarea id="w-'+e.id+'" lang="pl" spellcheck="false" rows="6" aria-label="Ваш текст"></textarea>'+
          '<div class="score" id="wc-'+e.id+'">0 слов</div>'+
          '<button type="button" class="btn ghost" data-show="'+e.id+'">Показать образец и чек-лист</button>'+
          '<div id="m-'+e.id+'" hidden><div class="model pl">'+esc(e.model)+'</div>'+
          '<p class="score">Нужные формы в образце: <span class="pl">'+e.model_future.map(esc).join(', ')+'</span></p>'+
          '<ul class="check">'+e.checklist.map((c,i)=>'<li><label><input type="checkbox" id="c-'+e.id+'-'+i+'"> '+esc(c)+'</label></li>').join('')+'</ul></div></section>';
        return;
      }
      if (e.kind==='text') h += '<div class="passage pl">'+esc(e.passage).replace(/\{(\d+)\}/g,'<span class="gap">($1)&nbsp;____</span>')+'</div>';
      h += e.items.map((it,i)=>{
          const key=e.id+'-'+i;
          const q=e.kind==='text' ? '('+esc(it.q)+')' : esc(it.q).replace(/\*\*(.+?)\*\*/g,'<span class="bold">$1</span>');
          const body = e.kind==='choice'
            ? '<div class="row">'+it.opts.map(o=>'<button type="button" class="opt" data-k="'+key+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>'
            : '<form class="row" data-k="'+key+'"><input id="in-'+key+'" autocomplete="off" autocapitalize="off" spellcheck="false" lang="pl" aria-label="Ответ"><button class="btn">Проверить</button></form>';
          return '<div class="it"><div class="q">'+(i+1)+'. '+q+'</div>'+body+'<div class="fb" id="fb-'+key+'" hidden></div></div>';
        }).join('')+'<div class="score" id="sc-'+e.id+'"></div></section>';
    });
  }
  h += '<p class="foot">Все польские формы проверены Morfeusz 2 · '+esc(D.checked)+'</p>';
  document.getElementById('app').innerHTML = h;
  const items = {}; EX.forEach(e=>(e.items||[]).forEach((it,i)=>items[e.id+'-'+i]={e,it}));
  const norm = v => v.trim().toLowerCase().replace(/\s+/g,' ');
  const plain = v => norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
  const done = {};
  function show(key, ok, dia){
    const {e,it} = items[key], fb = document.getElementById('fb-'+key);
    const more = it.a.length>1 ? ' Подходят: '+it.a.map(esc).join(', ')+'.' : '';
    fb.className = 'fb '+(ok?'ok':(dia?'dia':'no'));
    fb.innerHTML = ok ? 'Верно. '+esc(it.expl)+more
      : dia ? 'Почти: проверьте диакритику (ą, ę, ł, ś, ź, ż…).'
      : 'Нет. Правильно: <span class="pl">'+esc(it.a[0])+'</span>. '+esc(it.expl)+more+' <a href="#'+it.t+'">К правилу</a>';
    fb.hidden = false;
    if (!dia){ done[key]=ok; const n=e.items.length, k=Object.keys(done).filter(x=>x.startsWith(e.id+'-')), r=k.filter(x=>done[x]).length;
      document.getElementById('sc-'+e.id).textContent = 'Отвечено '+k.length+' из '+n+', верно '+r+'.'; }
  }
  document.getElementById('app').addEventListener('input', ev => {
    const t = ev.target; if (t.tagName!=='TEXTAREA') return;
    const id = t.id.slice(2), n = (t.value.match(/[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+/g)||[]).length, e = EX.find(x=>x.id===id);
    document.getElementById('wc-'+id).textContent = n+' слов'+(n<e.words[0]?' · мало':n>e.words[1]?' · много':' · в норме');
  });
  document.getElementById('app').addEventListener('click', ev => {
    const sh = ev.target.closest('[data-show]');
    if (sh){ const m=document.getElementById('m-'+sh.dataset.show); m.hidden=!m.hidden; sh.textContent=m.hidden?'Показать образец и чек-лист':'Скрыть образец'; return; }
    const b = ev.target.closest('.opt'); if (!b) return;
    const key=b.dataset.k, {it}=items[key], ok=it.a.includes(b.dataset.v);
    document.querySelectorAll('.opt[data-k="'+key+'"]').forEach(x=>x.classList.remove('ok','no'));
    b.classList.add(ok?'ok':'no'); show(key, ok, false);
  });
  document.getElementById('app').addEventListener('submit', ev => {
    ev.preventDefault(); const f=ev.target, key=f.dataset.k, inp=f.querySelector('input'), {it}=items[key];
    const v=norm(inp.value); if(!v) return;
    const ok = it.a.some(a=>norm(a)===v), dia = !ok && it.a.some(a=>plain(a)===plain(v));
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no'); show(key, ok, dia);
  });

})();
</script>
