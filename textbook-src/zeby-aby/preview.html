yślę, że to dobry pomysł]] — [[Nie sądzę, żeby to był dobry pomysł]])."}, {"type": "ex", "items": [{"pl": "Wątpię, żeby zdążył na pociąg.", "ru": "Сомневаюсь, что он успел/успеет на поезд."}]}]}, {"id": "t10", "title": "Чтобы не…", "facts": ["R9"], "blocks": [{"type": "p", "text": "**żeby nie** + инфинитив или форма на -ł. Прямое дополнение при отрицании — в dopełniacz (тема 8): [[żeby nie zgubić kluczy]]."}, {"type": "ex", "items": [{"pl": "Idź na palcach, żeby nie obudzić dziecka.", "ru": "Иди на цыпочках, чтобы не разбудить ребёнка."}, {"pl": "Powiedz mu, żeby nie palił papierosów.", "ru": "Скажи ему, чтобы не курил."}]}]}, {"id": "t11", "title": "Слишком… чтобы; так, чтобы", "facts": ["R10", "R14"], "blocks": [{"type": "p", "text": "**za / zbyt** + прилагательное, **żeby** + инфинитив. **tak, żeby** — «так, чтобы»."}, {"type": "ex", "items": [{"pl": "Jest za późno, żeby zaczynać nowy temat.", "ru": "Слишком поздно, чтобы начинать новую тему."}, {"pl": "Mów tak, żeby wszyscy słyszeli.", "ru": "Говори так, чтобы все слышали."}]}]}, {"id": "t12", "title": "aby, by, ażeby — стиль", "facts": ["R11"], "blocks": [{"type": "p", "text": "Смысл одинаковый. **żeby** — нейтрально и в разговоре; **aby** — официально (письма в учреждения, объявления); **by, ażeby** — книжно. В официальном письме на экзамене уместно [[aby]]."}, {"type": "ex", "items": [{"pl": "Uprzejmie proszę, aby Pan odpowiedział do piątku.", "ru": "Убедительно прошу Вас ответить до пятницы."}]}]}, {"id": "t13", "title": "Глаголы движения: иногда без żeby", "facts": ["R15"], "blocks": [{"type": "p", "text": "После iść, pójść, pobiec и т. п. цель часто выражается просто инфинитивом: [[Idę spać. Pobiegł otworzyć drzwi.]] Вариант с żeby тоже правилен: [[Idę tam, żeby zrobić zakupy.]]"}, {"type": "note", "kind": "tip", "text": "Правило подтверждено одним источником напрямую — дано одной строкой."}, {"type": "note", "kind": "mark", "text": "Правило подтверждено одним источником — дано одной строкой с пометкой."}], "marked": true}, {"id": "t14", "title": "На экзамене", "facts": ["EXAM"], "blocks": [{"type": "p", "text": "Żeby — частый ответ в задании II реальных экзаменов «союзы» (например, 06.2023, 04.2023, 02.2023, 03.2022). В сборнике — блок 11, зад. VIII и блок 12, зад. VI (союзы из рамки)."}, {"type": "steps", "items": ["Один и тот же человек — [[żeby]] + инфинитив.", "Разные люди — [[żebym, żebyś, żeby…]] + форма на -ł.", "Факт — [[że]], просьба или цель — [[żeby]]."]}]}], "exercises": [{"id": "e1", "title": "Окончание на żeby", "instr": "Впишите żeby с нужным окончанием (в 12 — aby).", "level": 2, "kind": "type", "items": [{"q": "Mama prosi, ___ (ja) wrócił przed dziesiątą.", "a": ["żebym"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Chcę, ___ (ty) zadzwonił do mnie jutro.", "a": ["żebyś"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Szef chce, ___ (my) skończyli raport do piątku.", "a": ["żebyśmy"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Proszę, ___ (wy) nie rozmawiali w czasie egzaminu.", "a": ["żebyście"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Nauczycielka chce, ___ (oni) przeczytali ten tekst.", "a": ["żeby"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Lekarz powiedział, ___ (ona) dużo piła.", "a": ["żeby"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Powiedz mu, ___ (on) zaczekał.", "a": ["żeby"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Rodzice chcą, ___ (ja) studiowała medycynę.", "a": ["żebym"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Prosiliśmy, ___ (ty) się nie spóźniała.", "a": ["żebyś"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Chciałbym, ___ (wy) przyjechali do nas w lipcu.", "a": ["żebyście"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Koledzy proszą, ___ (my) zrobili przerwę.", "a": ["żebyśmy"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "Dyrektor prosi, ___ (wy) przyszli o ósmej. (подсказка: aby + окончание)", "a": ["abyście"], "expl": "żeby = że + by.", "t": "t1"}]}, {"id": "e2", "title": "Инфинитив или форма на -ł?", "instr": "Поставьте глагол в скобках в нужную форму: инфинитив (тот же субъект) или форму на -ł (другой субъект).", "level": 2, "kind": "type", "items": [{"q": "Uczę się wieczorami, żeby ___ (zdać) egzamin B1.", "a": ["zdać"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Mówię wolno, żebyś mnie dobrze ___ (zrozumieć; ty — м.).", "a": ["zrozumiał"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Anna oszczędza pieniądze, żeby ___ (kupić) mieszkanie.", "a": ["kupić"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Otwórz okno, żeby ___ (wejść) świeże powietrze.", "a": ["weszło"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Zostawiłem ci klucz, żebyś ___ (móc; ty — ж.) wejść.", "a": ["mogła"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Wstałam wcześnie, żeby się nie ___ (spóźnić) na pociąg.", "a": ["spóźnić"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Dzwonię, żebyś ___ (wiedzieć; ty — м.), co się stało.", "a": ["wiedział"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Pracujemy dużo, żeby nasze dzieci ___ (mieć) lepsze życie.", "a": ["miały"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Piotr poszedł do apteki, żeby ___ (kupić) leki.", "a": ["kupić"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Napiszę do Ewy, żeby ___ (przyjść) na urodziny.", "a": ["przyszła"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Ćwiczę codziennie, żeby ___ (być) zdrowym.", "a": ["być"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Zamknij drzwi, żeby kot nie ___ (uciec).", "a": ["uciekł"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Kupiłem mapę, żebyśmy się nie ___ (zgubić).", "a": ["zgubili"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}, {"q": "Przyjechali wcześniej, żeby nam ___ (pomóc).", "a": ["pomóc"], "expl": "Цель при одном и том же субъекте: żeby + инфинитив.", "t": "t1"}]}, {"id": "e3", "title": "Соедините предложения", "instr": "Соедините два предложения с помощью żeby. Впишите одно слово.", "level": 2, "kind": "type", "items": [{"q": "Jadę do Krakowa. Chcę zwiedzić Wawel. → Jadę do Krakowa, żeby ___ Wawel.", "a": ["zwiedzić"], "expl": "Субъект тот же — żeby + инфинитив.", "t": "t3"}, {"q": "Uczę się polskiego. Chcę pracować w Polsce. → Uczę się polskiego, żeby ___ w Polsce.", "a": ["pracować"], "expl": "Субъект тот же — żeby + инфинитив.", "t": "t3"}, {"q": "Mówię głośno. Wszyscy mają mnie słyszeć. → Mówię głośno, żeby wszyscy mnie ___.", "a": ["słyszeli"], "expl": "Субъекты разные — żeby + форма на -ł (wszyscy → słyszeli, dzieci → zjadły).", "t": "t4"}, {"q": "Kupiłam słownik. Chcę szybciej czytać. → Kupiłam słownik, żeby szybciej ___.", "a": ["czytać"], "expl": "Субъект тот же — żeby + инфинитив.", "t": "t3"}, {"q": "Daję ci mój numer. Możesz do mnie zadzwonić. → Daję ci mój numer, ___ mógł do mnie zadzwonić.", "a": ["żebyś", "abyś"], "expl": "Субъекты разные: окончание лица присоединяется к żeby (ty → żebyś, wy → żebyście).", "t": "t2"}, {"q": "Wychodzimy wcześniej. Nie chcemy stać w korku. → Wychodzimy wcześniej, żeby nie ___ w korku.", "a": ["stać"], "expl": "Субъект тот же — żeby + инфинитив.", "t": "t3"}, {"q": "Mama gotuje zupę. Dzieci mają zjeść coś ciepłego. → Mama gotuje zupę, żeby dzieci ___ coś ciepłego.", "a": ["zjadły"], "expl": "Субъекты разные — żeby + форма на -ł (wszyscy → słyszeli, dzieci → zjadły).", "t": "t4"}, {"q": "Oszczędzam. Chcę pojechać na wakacje. → Oszczędzam, żeby ___ na wakacje.", "a": ["pojechać"], "expl": "Субъект тот же — żeby + инфинитив.", "t": "t3"}, {"q": "Tłumaczę ci to jeszcze raz. Masz wszystko zrozumieć. → Tłumaczę ci to jeszcze raz, ___ wszystko zrozumiała.", "a": ["żebyś", "abyś"], "expl": "Субъекты разные: окончание лица присоединяется к żeby (ty → żebyś, wy → żebyście).", "t": "t2"}, {"q": "Włączyłem światło. Chciałem coś zobaczyć. → Włączyłem światło, żeby coś ___.", "a": ["zobaczyć"], "expl": "Субъект тот же — żeby + инфинитив.", "t": "t3"}, {"q": "Zapisałam adres. Nie chciałam go zapomnieć. → Zapisałam adres, żeby go nie ___.", "a": ["zapomnieć"], "expl": "Субъект тот же — żeby + инфинитив.", "t": "t3"}, {"q": "Piszę do was. Macie przyjść w sobotę. → Piszę do was, ___ przyszli w sobotę.", "a": ["żebyście", "abyście"], "expl": "Субъекты разные: окончание лица присоединяется к żeby (ty → żebyś, wy → żebyście).", "t": "t2"}]}, {"id": "e4", "title": "Передайте просьбу", "instr": "Передайте просьбу с помощью żeby: впишите одно слово — форму на -ł. Если говорит «я», засчитываются обе формы рода.", "level": 2, "kind": "type", "items": [{"q": "Mama do mnie: «Posprzątaj pokój!» → Mama chce, żebym ___ pokój.", "a": ["posprzątał", "posprzątała"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Szef do nas: «Skończcie projekt do piątku!» → Szef chce, żebyśmy ___ projekt do piątku.", "a": ["skończyli", "skończyły"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Lekarz do pacjenta: «Proszę nie palić!» → Lekarz prosi pacjenta, żeby nie ___.", "a": ["palił"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Ja do ciebie: «Zadzwoń wieczorem!» → Proszę cię, żebyś ___ wieczorem.", "a": ["zadzwonił", "zadzwoniła"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Nauczyciel do uczniów: «Otwórzcie książki!» → Nauczyciel mówi, żeby uczniowie ___ książki.", "a": ["otworzyli"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Anna do Marka: «Kup chleb!» → Anna powiedziała Markowi, żeby ___ chleb.", "a": ["kupił"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Policjant do kierowcy: «Proszę pokazać dokumenty.» → Policjant poprosił kierowcę, żeby ___ dokumenty.", "a": ["pokazał"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Babcia do wnuczki: «Ubierz się ciepło!» → Babcia mówi wnuczce, żeby się ___ ciepło.", "a": ["ubrała"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Koleżanka do mnie: «Pomóż mi!» → Koleżanka prosi, żebym jej ___.", "a": ["pomógł", "pomogła"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Rodzice do nas: «Nie wracajcie późno!» → Rodzice proszą, żebyśmy nie ___ późno.", "a": ["wracali", "wracały"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Urzędniczka do mnie: «Proszę wypełnić formularz.» → Urzędniczka prosi, żebym ___ formularz.", "a": ["wypełnił", "wypełniła"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}, {"q": "Ty do Ewy: «Przyjdź jutro!» → Powiedz Ewie, żeby ___ jutro.", "a": ["przyszła"], "expl": "Просьба к другому лицу: żeby (+ окончание) + форма на -ł в нужном роде.", "t": "t5"}]}, {"id": "e5", "title": "że или żeby?", "instr": "Впишите że или żeby (aby тоже засчитывается).", "level": 2, "kind": "type", "items": [{"q": "Wiem, ___ masz rację.", "a": ["że"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Chcę, ___ przyszedł wcześniej.", "a": ["żeby", "aby"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Powiedz mu, ___ dzwoniła mama.", "a": ["że"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Powiedz mu, ___ zadzwonił do mamy.", "a": ["żeby", "aby"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Myślę, ___ to dobry pomysł.", "a": ["że"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Nie sądzę, ___ to był dobry pomysł.", "a": ["żeby", "aby"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Cieszę się, ___ przyjechałeś.", "a": ["że"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Marzę o tym, ___ mieć własny dom.", "a": ["żeby", "aby"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Napisała, ___ wróci w niedzielę.", "a": ["że"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Napisała, ___ na nią nie czekać.", "a": ["żeby", "aby"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Słyszałem, ___ szukasz pracy.", "a": ["że"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Wątpię, ___ zdążył na pociąg.", "a": ["żeby", "aby"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Szef uważa, ___ projekt jest gotowy.", "a": ["że"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}, {"q": "Zależy mi na tym, ___ wszyscy byli zadowoleni.", "a": ["żeby", "aby"], "expl": "że сообщает факт (глагол в обычном времени), żeby — цель, желание, просьбу.", "t": "t8"}]}, {"id": "e6", "title": "Чтобы не… (+ dopełniacz)", "instr": "Поставьте слово в скобках в нужную форму (после отрицания — dopełniacz; глагол — форма на -ł).", "level": 2, "kind": "type", "items": [{"q": "Schowaj portfel, żeby nie zgubić ___ (pieniądze).", "a": ["pieniędzy"], "expl": "Отрицательная цель: żeby nie + инфинитив / форма на -ł: Śpieszę się, żeby nie być spóźniona.", "t": "t10"}, {"q": "Mów cicho, żeby nie obudzić ___ (dziecko).", "a": ["dziecka"], "expl": "Отрицательная цель: żeby nie + инфинитив / форма на -ł: Śpieszę się, żeby nie być spóźniona.", "t": "t10"}, {"q": "Jedź wolno, żeby nie mieć ___ (wypadek).", "a": ["wypadku"], "expl": "Отрицательная цель: żeby nie + инфинитив / форма на -ł: Śpieszę się, żeby nie być spóźniona.", "t": "t10"}, {"q": "Uczę się codziennie, żeby nie stracić ___ (motywacja).", "a": ["motywacji"], "expl": "Отрицательная цель: żeby nie + инфинитив / форма на -ł: Śpieszę się, żeby nie być spóźniona.", "t": "t10"}, {"q": "Wyłączyłem telefon, żeby nie słyszeć ___ (powiadomienia).", "a": ["powiadomień"], "expl": "Отрицательная цель: żeby nie + инфинитив / форма на -ł: Śpieszę się, żeby nie być spóźniona.", "t": "t10"}, {"q": "Zrób listę, żeby nie zapomnieć ___ (nic).", "a": ["niczego"], "expl": "Отрицательная цель: żeby nie + инфинитив / форма на -ł: Śpieszę się, żeby nie być spóźniona.", "t": "t10"}, {"q": "Wyszliśmy wcześniej, żeby nie przegapić ___ (początek) filmu.", "a": ["początku"], "expl": "Отрицательная цель: żeby nie + инфинитив / форма на -ł: Śpieszę się, żeby nie być spóźniona.", "t": "t10"}, {"q": "Piję dużo wody, żeby nie mieć ___ (ból) głowy.", "a": ["bólu"], "expl": "Отрицательная цель: żeby nie + инфинитив / форма на -ł: Śpieszę się, żeby nie być spóźniona.", "t": "t10"}, {"q": "Zapisz hasło, żeby nie zablokować ___ (konto).", "a": ["konta"], "expl": "Отрицательная цель: żeby nie + инфинитив / форма на -ł: Śpieszę się, żeby nie być spóźniona.", "t": "t10"}, {"q": "Weź parasol, żeby nie zmoknąć. Sprawdź pogodę, żeby nie zapomnieć ___ (parasol).", "a": ["parasola"], "expl": "После отрицания дополнение — в dopełniaczu: parasol → parasola.", "t": "t10"}, {"q": "Poproś go, żeby nie ___ (palić) w domu.", "a": ["palił"], "expl": "Отр бы»: za/zbyt + прилагательное/наречие, żeby + инфинитив: Jestem zbyt zajęta, żeby robić zakupy.", "t": "t11"}, {"q": "Wątpię, żebyś ___ (znaleźć; ty — м.) tani bilet w sierpniu.", "a": ["znalazł"], "expl": "«Слишком … чтобы»: za/zbyt + прилагательное/наречие, żeby + инфинитив: Jestem zbyt zajęta, żeby robić zakupy.", "t": "t11"}, {"q": "Mów tak, żeby wszyscy cię ___ (słyszeć).", "a": ["słyszeli"], "expl": "«Слишком … чтобы»: za/zbyt + прилагательное/наречие, żeby + инфинитив: Jestem zbyt zajęta, żeby robić zakupy.", "t": "t11"}]}, {"id": "e8", "title": "Тест в формате экзамена: письмо", "instr": "Uzupełnij tekst. Wpisz że/żeby (z końcówką) i czasownik w odpowiedniej formie. W nawiasie: podmiot i bezokolicznik. Ola — kobieta, Kasia — kobieta.", "format": "exam", "level": 3, "kind": "text", "passage": "Cześć Kasiu! Piszę, {1} cię o radę. Moja szefowa chce, {2} w przyszłym miesiącu na szkolenie do Gdańska. Chciałabym, {3} ze mną, bo sama trochę się boję. Szefowa powiedziała, {4} hotel jak najszybciej, {5} za dużo. Mój mąż prosi, {6} też dzieci, ale nie sądzę, {7} dobry pomysł — szkolenie trwa cały dzień. Poza tym jest za daleko, {8} z małymi dziećmi samochodem. Mama obiecała, {9} do nas i zajmie się dziećmi. Napisz mi, proszę, czy masz czas, {10} wcześniej. Kupię bilety wcześniej, {11} tańsze. Zależy mi na tym, {12} gotowe do piątku. Ściskam, Ola", "items": [{"q": "zapytać", "a": ["żeby zapytać", "aby zapytać"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "ja: pojechać", "a": ["żebym pojechała", "abym pojechała"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "ty: pojechać", "a": ["żebyś pojechała", "abyś pojechała"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "ja: zarezerwować", "a": ["żebym zarezerwowała", "abym zarezerwowała"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "nie płacić", "a": ["żeby nie płacić", "aby nie płacić"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "my: wziąć", "a": ["żebyśmy wzięli", "abyśmy wzięli"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "to: być", "a": ["żeby to był", "aby to był"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "jechać", "a": ["żeby jechać", "aby jechać"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "ona: przyjść", "a": ["że przyjdzie"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "ja: wiedzieć", "a": ["żebym wiedziała", "abym wiedziała"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "one: być", "a": ["żeby były", "aby były"], "expl": "żeby = że + by.", "t": "t1"}, {"q": "wszystko: być", "a": ["żeby wszystko było", "aby wszystko było"], "expl": "żeby = że + by.", "t": "t1"}]}, {"id": "e9", "title": "Przekształcenia", "instr": "Перестройте предложение, как в задании VI экзамена. Впишите одно слово.", "format": "exam", "level": 3, "kind": "type", "items": [{"q": "«Zamknij okno!» — powiedziała mi mama (я — ж.). → Mama powiedziała, ___ zamknęła okno.", "a": ["żebym", "abym"], "expl": "Просьба или желание о другом лице: żeby + окончание лица (ja → żebym, wy → żebyście).", "t": "t5"}, {"q": "Uczę się polskiego w celu znalezienia pracy. → Uczę się polskiego, żeby ___ pracę.", "a": ["znaleźć"], "expl": "Субъект тот же — żeby + инфинитив.", "t": "t3"}, {"q": "Szef do mnie: «Proszę przygotować raport.» (я — м.) → Szef poprosił mnie, ___ przygotował raport.", "a": ["żebym", "abym"], "expl": "Просьба или желание о другом лице: żeby + окончание лица (ja → żebym, wy → żebyście).", "t": "t5"}, {"q": "Ta walizka jest bardzo ciężka. Nie da się jej podnieść. → Ta walizka jest za ciężka, żeby ją ___.", "a": ["podnieść"], "expl": "za + прилагательное, żeby + инфинитив.", "t": "t11"}, {"q": "Myślę, że to nie jest prawda. → Nie sądzę, żeby to ___ prawda.", "a": ["była"], "expl": "После nie sądzę — żeby + форма на -ł: żeby to była prawda.", "t": "t9"}, {"q": "Mówię wolno, bo chcę, żebyście mnie zrozumieli. → Mówię wolno, ___ mnie zrozumieli.", "a": ["żebyście", "abyście"], "expl": "Просьба или желание о другом лице: żeby + окончание лица (ja → żebym, wy → żebyście).", "t": "t5"}, {"q": "Powiedział, żebym czekał. → Kazał mi ___.", "a": ["czekać"], "expl": "kazać + кому (celownik) + инфинитив, без żeby.", "t": "t6"}, {"q": "Исправьте ошибку: Chcę, **żebym pojechał** do Gdańska. → Chcę ___ do Gdańska.", "a": ["pojechać"], "expl": "Субъект тот же — не żeby, а инфинитив: Chcę pojechać.", "t": "t3"}]}, {"id": "e10", "level": 4, "kind": "write", "title": "Письмо подруге (неофициальное)", "instr": "Napisz e-mail do koleżanki (80–100 słów). Przeprowadzasz się i potrzebujesz pomocy. Napisz: kiedy i dlaczego się przeprowadzasz; o co ją prosisz; co chcesz zrobić, żeby przeprowadzka poszła szybko; jak jej podziękujesz.", "words": [80, 100], "need": "Не меньше 4 конструкций с żeby, 2 — с другим субъектом (żebyś, żebyśmy), одна żeby nie…", "model": "Cześć Kasiu!\nW sobotę przeprowadzam się do nowego mieszkania, bo chcę mieszkać bliżej pracy. Mam do Ciebie wielką prośbę. Czy mogłabyś przyjść w sobotę rano, żeby pomóc mi spakować książki i naczynia? Chciałabym, żebyśmy skończyły do południa, bo samochód przyjedzie o pierwszej. Wieczorem zapakuję ubrania, żeby nie tracić czasu w sobotę. Poproszę też brata, żeby przyniósł kartony. Może też Twój mąż mógłby przyjść, żeby pomóc nosić meble? Chcę, żebyś po wszystkim została na kolację. Ugotuję Twoje ulubione pierogi, żeby Ci podziękować! Daj znać, czy masz czas.\nŚciskam,\nOla", "model_future": ["żeby pomóc", "żebyśmy skończyły", "żeby nie tracić", "żeby przyniósł", "żebyś po wszystkim została", "żeby Ci podziękować"], "checklist": ["не меньше 4 конструкций с żeby", "хотя бы 2 — с другим субъектом (żebyś…, żebyśmy…)", "хотя бы 1 — żeby nie …", "обращение и подпись", "80–100 слов"], "t": "t1", "items": []}, {"id": "e11", "level": 4, "kind": "write", "title": "Официальное письмо администрации", "instr": "Napisz list do administracji budynku (80–100 słów). W Twoim mieszkaniu od tygodnia nie działa ogrzewanie. Opisz problem, poproś o naprawę i termin wizyty, zaproponuj, jak się z Tobą skontaktować.", "words": [80, 100], "need": "Официальное обращение, не меньше 3 конструкций с aby, просьба «Uprzejmie proszę, aby…», подпись Z poważaniem.", "model": "Szanowni Państwo,\nod tygodnia w moim mieszkaniu przy ulicy Długiej 15 m. 8 nie działa ogrzewanie. Kaloryfery są zimne, a temperatura w pokojach spadła do piętnastu stopni. Zgłaszałam problem telefonicznie, ale nikt nie przyszedł. Uprzejmie proszę, aby Państwo jak najszybciej przysłali fachowca. Proszę również, aby ktoś zadzwonił do mnie wcześniej, abym mogła być w domu w czasie wizyty. Najlepiej pasowałby mi termin po godzinie szesnastej. Mój numer telefonu to 600 100 200. Proszę też o kontakt mailowy, aby potwierdzić termin. Liczę na szybką reakcję.\nZ poważaniem\nMaria Kowalczyk", "model_future": ["aby Państwo jak najszybciej przysłali", "aby ktoś zadzwonił", "abym mogła", "aby potwierdzić"], "checklist": ["официальное обращение (Szanowni Państwo)", "не меньше 3 конструкций с aby (abym, aby Państwo…)", "просьба через «Uprzejmie proszę, aby…»", "официальная подпись (Z poważaniem)", "80–100 слов"], "t": "t12", "items": []}]}, "facts": {"R1": {"refs": ["ELA (раздел «żeby = że + by, and it takes the clitic»)", "WEA (раздел Conjunctions / Subjunctive clauses: «the by of the conjunction … takes personal endings»)", "ZPA (часть о частице by: «Pisownia» — łącznie ze spójnikami (gdybym…); пример «Żebyś wiedział!»)", "PO s. 187–191 (żebym chodził, żebyś się uczesał(a), żebyśmy byli, żebyście były — окончание на żeby)", "PO s. 193 (рамка: żebym, żebyś, żeby, żebyśmy, żebyście)"], "status": "ok"}, "R2": {"refs": ["DZA (раздел Purpose clauses: «purpose clauses are introduced by żeby followed by an infinitive»)", "ELA (раздел «Purpose: the same-subject vs different-subject split»)", "TLA (пункт aby/żeby + bezokolicznik: «Odwiedziłam ją, aby/żeby jej pogratulować»)", "PO s. 167 («poszedłbym nad Wisłę, żeby popatrzeć na pomnik smoka»)", "PO s. 187 («co robić, żeby mieć święty spokój»)"], "status": "ok"}, "R3": {"refs": ["ELA (разделы «Purpose: the same-subject vs different-subject split» и «Common Mistakes»)", "WEA (Conjunctions: aby/żeby «can take an infinitive phrase or a past-tense sentence»)", "XXA (значения 1, 2: «with past tense»)", "PO s. 188 (упражнение «Mama namawia mnie, żebym (poszłam, poszła, poszedł) na kurs» — после żebym форма на -ł без окончания: poszła)"], "status": "ok"}, "R4": {"refs": ["DZA (раздел Purpose clauses: «żeby is NOT optional»)", "ELA (раздел «Purpose …»: смешение конструкций названо «the classic error»)"], "status": "ok"}, "R5": {"refs": ["ELA (раздел «Indirect commands and requests: ‘I want you to…’»)", "WEA (Subjunctive clauses: «used with verbs meaning ‘want’, ‘expect’», пример chce, żeby(m) śpiewał)", "ELB (пункт Commands and requests: «Powiedział, żebym poszedł do domu»)", "PO s. 192 («Spójnika „żeby” używamy przy relacjonowaniu propozycji, życzeń, rad, próśb, poleceń: Poprosiła go, żeby zadzwonił do niej wieczorem»)", "PO s. 187–189 («Mama często powtarza, żebym się uczył hiszpańskiego»; «Babcia prosi mnie, żebym…»)"], "status": "ok"}, "R6": {"refs": ["ELA (раздел «Wishes: Chciałbym, żeby…»)", "XXA (значение «desire or wish, with past tense»; пример «Żebyś wiedział!»)", "ZPA (пример «Żebyś wiedział!»)"], "status": "ok"}, "R7": {"refs": ["ELC (разделы «że vs żeby»; пример с powiedz mu)", "DZA (раздел Complement clauses: «finite complement clauses are introduced by że»)", "ELB (пункты Statements (że) и Commands and requests (żeby); «A comma always precedes że, czy, żeby»)", "PO s. 192 («Spójnika „że” używamy przy relacjonowaniu informacji… Spójnika „żeby” — przy relacjonowaniu propozycji, życzeń, rad, próśb, poleceń»)"], "status": "ok"}, "R8": {"refs": ["ELC (пример «Nie sądzę, żeby to był dobry pomysł» — отрицание переводит в ирреальность)", "XXA (значение «doubt, chiefly in negated sentences: that, if (past tense)»)"], "status": "ok"}, "R9": {"refs": ["DZA (примеры «Studiuję, żeby się nie nudzić», «Śpieszę się, żeby nie być spóźniona»)", "ELA (пример «Idź na palcach, żeby nie obudzić d ech»: https://elon.io/grammar/polish/syntax/reported-speech", "ELC": "elon.io — «że and żeby: That, So That»: https://elon.io/grammar/polish/conjunctions/subordinating-ze", "ELD": "elon.io — урок «clauses of excess (zbyt… żeby)»: https://elon.io/learn-polish/lesson/clauses-of-excess-(zbyt...-%C5%BCeby)", "XXB": "Vaia — «Polish Adverbial Clauses»: https://www.vaia.com/en-us/explanations/polish/polish-syntax/polish-adverbial-clauses", "ELE": "elon.io — «wołać, prosić, kazać»: https://elon.io/grammar/polish/verbs-reference/wolac-prosic-kazac", "XXC": "Langenscheidt Polish–German — «kazać»: https://en.langenscheidt.com/polish-german/kaza%C4%87", "XXD": "M. Danielewiczowa, I. Duraj-Nowosielska, «Polski bezokolicznik celu przy czasownikach ruchu», LingVaria 18(1)(35), 2023: https://journals.akademicka.pl/lv/article/view/5077", "KEY": "Официальные ключи комиссии: сборник B1 2017 (tests/b1-sbornik.js) и экзамены 2017–2024 (tests/b1-*.js) — найдено поиском по заданиям раздела Gramatyka", "MORF": "Morfeusz 2 (SGJP) — проверка польских слов скриптом tools/morfeusz_check.py", "PO": "Gramatyka z kulturą. Przez osoby (файлы проекта Gramatyka-z-kultura.-Przez-osoby.-Logo-*.pdf)"}, "checked": "24.10.2026"}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const T = D.topic, F = D.facts, SRC = D.sources;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // [[…]] — польский текст, **…** — выделение
  const rich = s => esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="pl">$1</span>').replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s;)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  // раскрыть сокращения источников (PO, JPBG…) один раз на раздел
  const abbr = Object.keys(SRC);
  function refsFor(ids){
    const out = [], used = new Set();
    ids.forEach(id => {
      const refs = id === 'EXAM' ? T.exam_ref.refs : (F[id] ? F[id].refs : []);
      refs.forEach(r => { out.push(r); abbr.forEach(a => { if (new RegExp('(^|[^A-ZŁ])'+a+'([^A-ZŁ]|$)').test(r)) used.add(a); }); });
    });
    const legend = [...used].map(a => '<b>'+a+'</b> — '+SRC[a]);
    return {out, legend};
  }
  const block = b => {
    switch(b.type){
      case 'p': return '<p>'+rich(b.text)+'</p>';
      case 'note': return b.kind === 'mark'
        ? '<div class="note mark"><b>С пометкой</b>'+rich(b.text)+'</div>'
        : '<div class="note tip">'+rich(b.text)+'</div>';
      case 'chips': return '<div class="chips">'+b.items.map(i=>'<span>'+esc(i)+'</span>').join('')+'</div>';
      case 'ex': return '<div class="ex">'+b.items.map(i=>'<div><div class="pl">'+esc(i.pl)+'</div><div class="ru">'+esc(i.ru)+'</div></div>').join('')+'</div>';
      case 'fix': return '<div class="fix">'+b.items.map(i=>'<span class="bad">'+esc(i.bad)+'</span><span class="arr" aria-hidden="true">→</span><span class="good">'+esc(i.good)+'</span>').join('')+'</div>';
      case 'steps': return '<ol class="steps">'+b.items.map(i=>'<li>'+rich(i)+'</li>').join('')+'</ol>';
      case 'table': {
        const pc = new Set(b.pl_cols || []);
        const head = b.head.some(h=>h) ? '<thead><tr>'+b.head.map(h=>'<th>'+rich(h)+'</th>').join('')+'</tr></thead>' : '';
        const rows = b.rows.map(r=>'<tr>'+r.map((c,i)=>{
          const lab = i===0 && b.head[0]==='' ;
          const cls = lab ? 'lab'+(pc.has(i)?' pl':'') : (pc.has(i)?'pl':'');
          return '<td'+(cls?' class="'+cls+'"':'')+'>'+(pc.has(i)?esc(c.replace(/\[\[|\]\]/g,'')):rich(c))+'</td>';
        }).join('')+'</tr>').join('');
        return '<div class="tw"><table>'+head+'<tbody>'+rows+'</tbody></table></div>';
      }
    }
    return '';
  };
  let h = '<div class="top"><span class="crumb">Грамматика · '+esc(T.group)+'</span><span class="badge">'+esc(T.level)+'</span></div>'+
    '<header><h1>'+esc(T.title_pl)+'</h1><div class="sub">'+esc(T.title_ru)+'</div><p class="lead">'+esc(T.lead)+'</p></header>'+
    '<div class="draft">Черновик: '+esc(T.stage)+'. Источники — под каждым разделом теории.</div>';
  T.theory.forEach(sec => {
    const r = refsFor(sec.facts);
    h += '<section class="card" id="'+sec.id+'"><h2>'+rich(sec.title)+'</h2>'+sec.blocks.map(block).join('')+
      '<details><summary>Источники · '+r.out.length+'</summary><ul>'+r.out.map(x=>'<li>'+linkify(x)+'</li>').join('')+
      (r.legend.length?'<li style="list-style:none;margin-left:-18px;margin-top:4px">'+r.legend.map(linkify).join('<br>')+'</li>':'')+'</ul></details></section>';
  });
  const EX = T.exercises || [];
  if (EX.length){
    const LV = {1:'Узнать',2:'Образовать',3:'Применить',4:'Свой текст'};
    h += '<h2 class="exh" id="ex">Упражнения</h2>';
    EX.forEach(e => {
      h += '<section class="card" id="'+e.id+'"><div class="lvl">Ступень '+e.level+' · '+LV[e.level]+(e.format==='exam'?' · формат экзамена':'')+'</div><h2>'+(e.kind==='text'||e.kind==='write'?'<span class="pl">'+esc(e.title)+'</span>':esc(e.title))+'</h2>'+
        (e.instr?'<p>'+esc(e.instr)+'</p>':'');
      if (e.kind==='write'){
        h += '<p class="need">'+esc(e.need)+' Объём: '+e.words[0]+'–'+e.words[1]+' слов.</p>'+
          '<textarea id="w-'+e.id+'" lang="pl" spellcheck="false" rows="6" aria-label="Ваш текст"></textarea>'+
          '<div class="score" id="wc-'+e.id+'">0 слов</div>'+
          '<button type="button" class="btn ghost" data-show="'+e.id+'">Показать образец и чек-лист</button>'+
          '<div id="m-'+e.id+'" hidden><div class="model pl">'+esc(e.model)+'</div>'+
          '<p class="score">Нужные формы в образце: <span class="pl">'+e.model_future.map(esc).join(', ')+'</span></p>'+
          '<ul class="check">'+e.checklist.map((c,i)=>'<li><label><input type="checkbox" id="c-'+e.id+'-'+i+'"> '+esc(c)+'</label></li>').join('')+'</ul></div></section>';
        return;
      }
      if (e.kind==='text') h += '<div class="passage pl">'+esc(e.passage).replace(/\{(\d+)\}/g,'<span class="gap">($1)&nbsp;____</span>')+'</div>';
      h += e.items.map((it,i)=>{
          const key=e.id+'-'+i;
          const q=e.kind==='text' ? '('+esc(it.q)+')' : esc(it.q).replace(/\*\*(.+?)\*\*/g,'<span class="bold">$1</span>');
          const body = e.kind==='choice'
            ? '<div class="row">'+it.opts.map(o=>'<button type="button" class="opt" data-k="'+key+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>'
            : '<form class="row" data-k="'+key+'"><input id="in-'+key+'" autocomplete="off" autocapitalize="off" spellcheck="false" lang="pl" aria-label="Ответ"><button class="btn">Проверить</button></form>';
          return '<div class="it"><div class="q">'+(i+1)+'. '+q+'</div>'+body+'<div class="fb" id="fb-'+key+'" hidden></div></div>';
        }).join('')+'<div class="score" id="sc-'+e.id+'"></div></section>';
    });
  }
  h += '<p class="foot">Все польские формы проверены Morfeusz 2 · '+esc(D.checked)+'</p>';
  document.getElementById('app').innerHTML = h;
  const items = {}; EX.forEach(e=>(e.items||[]).forEach((it,i)=>items[e.id+'-'+i]={e,it}));
  const norm = v => v.trim().toLowerCase().replace(/\s+/g,' ');
  const plain = v => norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
  const done = {};
  function show(key, ok, dia){
    const {e,it} = items[key], fb = document.getElementById('fb-'+key);
    const more = it.a.length>1 ? ' Подходят: '+it.a.map(esc).join(', ')+'.' : '';
    fb.className = 'fb '+(ok?'ok':(dia?'dia':'no'));
    fb.innerHTML = ok ? 'Верно. '+esc(it.expl)+more
      : dia ? 'Почти: проверьте диакритику (ą, ę, ł, ś, ź, ż…).'
      : 'Нет. Правильно: <span class="pl">'+esc(it.a[0])+'</span>. '+esc(it.expl)+more+' <a href="#'+it.t+'">К правилу</a>';
    fb.hidden = false;
    if (!dia){ done[key]=ok; const n=e.items.length, k=Object.keys(done).filter(x=>x.startsWith(e.id+'-')), r=k.filter(x=>done[x]).length;
      document.getElementById('sc-'+e.id).textContent = 'Отвечено '+k.length+' из '+n+', верно '+r+'.'; }
  }
  document.getElementById('app').addEventListener('input', ev => {
    const t = ev.target; if (t.tagName!=='TEXTAREA') return;
    const id = t.id.slice(2), n = (t.value.match(/[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+/g)||[]).length, e = EX.find(x=>x.id===id);
    document.getElementById('wc-'+id).textContent = n+' слов'+(n<e.words[0]?' · мало':n>e.words[1]?' · много':' · в норме');
  });
  document.getElementById('app').addEventListener('click', ev => {
    const sh = ev.target.closest('[data-show]');
    if (sh){ const m=document.getElementById('m-'+sh.dataset.show); m.hidden=!m.hidden; sh.textContent=m.hidden?'Показать образец и чек-лист':'Скрыть образец'; return; }
    const b = ev.target.closest('.opt'); if (!b) return;
    const key=b.dataset.k, {it}=items[key], ok=it.a.includes(b.dataset.v);
    document.querySelectorAll('.opt[data-k="'+key+'"]').forEach(x=>x.classList.remove('ok','no'));
    b.classList.add(ok?'ok':'no'); show(key, ok, false);
  });
  document.getElementById('app').addEventListener('submit', ev => {
    ev.preventDefault(); const f=ev.target, key=f.dataset.k, inp=f.querySelector('input'), {it}=items[key];
    const v=norm(inp.value); if(!v) return;
    const ok = it.a.some(a=>norm(a)===v), dia = !ok && it.a.some(a=>plain(a)===plain(v));
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no'); show(key, ok, dia);
  });

})();
</script>
