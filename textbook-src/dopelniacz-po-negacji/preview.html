 "a": ["tej restauracji"], "expl": "Меняется вся группа: прилагательные, местоимения, числа — тоже в родительный: ten adres → tego adresu, tę książkę → tej…", "t": "t5"}, {"q": "Kupiłaś bilety? — Nie, nie kupiłam ___.", "a": ["biletów"], "expl": "Если глагол с прямым дополнением в винительном (Biernik) стоит с nie, дополнение переходит в родительный (Dopełniacz)…", "t": "t1"}, {"q": "Będzie jutro egzamin? — Nie, jutro nie będzie ___.", "a": ["egzaminu"], "expl": "Отсутствие: nie ma / nie było / nie będzie + Dopełniacz (безличная форма, не меняется по лицам): Ojca nie ma w domu.", "t": "t2"}, {"q": "Pijesz alkohol? — Nie, nie piję ___.", "a": ["alkoholu"], "expl": "Если глагол с прямым дополнением в винительном (Biernik) стоит с nie, дополнение переходит в родительный (Dopełniacz)…", "t": "t1"}, {"q": "Widziałeś moje klucze? — Nie, nie widziałem ___.", "a": ["twoich kluczy"], "expl": "Меняется вся группа: прилагательные, местоимения, числа — тоже в родительный: ten adres → tego adresu, tę książkę → tej…", "t": "t5"}]}, {"id": "e8", "title": "Opinia o mieszkaniu na wynajem", "instr": "Proszę wpisać wyrazy z nawiasu w odpowiedniej formie. Uwaga: nie po każdym zaprzeczeniu zmienia się przypadek!", "format": "exam", "level": 3, "kind": "text", "passage": "Wynająłem to mieszkanie na tydzień i niestety nie polecam. Na zdjęciach był duży balkon, ale w rzeczywistości nie było {1}. W kuchni nie było {2} ani {3}. Przez dwa dni nie mieliśmy {4}. Właściciel nie odbierał {5}, więc nie mogliśmy zgłosić {6}. W łazience nie znalazłem {7}. Nie mam {8} do lokalizacji — jest blisko centrum, ale nie ma tu {9}. Sąsiedzi byli mili, ale nie rozumieli {10}. Właściciel w ogóle nie interesował się {11}. Na koniec nie oddał nam {12} i nawet nie pomógł {13} z bagażami. Nie polecam {14} nikomu.", "items": [{"q": "balkon", "a": ["balkonu"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "mikrofalówka", "a": ["mikrofalówki"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "czajnik", "a": ["czajnika"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "ciepła woda", "a": ["ciepłej wody"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "telefon", "a": ["telefonu"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "problem", "a": ["problemu"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "ręcznik", "a": ["ręcznika"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "zastrzeżenia", "a": ["zastrzeżeń"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "żaden sklep", "a": ["żadnego sklepu"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "moje pytania", "a": ["moich pytań"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "nasze problemy", "a": ["naszymi problemami"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "kaucja", "a": ["kaucji"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "moja żona", "a": ["mojej żonie"], "expl": "См. правило в теории.", "t": "t1"}, {"q": "to mieszkanie", "a": ["tego mieszkania"], "expl": "См. правило в теории.", "t": "t1"}]}, {"id": "e9", "level": 4, "kind": "write", "title": "E-mail z reklamacją do hotelu", "instr": "Wróciłeś/wróciłaś z hotelu, który nie spełnił obietnic z oferty. Napisz oficjalny e-mail z reklamacją (80–100 słów): czego nie było, co nie działało, czego oczekujesz.", "words": [80, 100], "need": "Не меньше 3 «nie było + родительный» и 3 «nie + глагол + родительный»; одно отрицание без смены падежа.", "model": "Szanowni Państwo,\nw dniach 3–7 sierpnia mieszkałam w Państwa hotelu. Niestety, nie jestem zadowolona z pobytu. W ofercie był basen, ale na miejscu nie było basenu. W pokoju nie było klimatyzacji ani sejfu, a przez dwa dni nie mieliśmy ciepłej wody. Codziennie prosiłam o nowe ręczniki, ale nie dostałam ręczników ani razu. W restauracji nie było też wegetariańskich dań. Przez cały pobyt nie widziałam też sprzątaczki. Recepcja nie interesowała się naszymi problemami i nikt nam nie pomógł. Oczekuję zwrotu części pieniędzy i przeprosin.\nZ poważaniem\nIrina Petrenko", "mod ation»)", "PP s. 40 («Dopełniacza używamy: … d) gdy dokonujemy negacji biernika (nie lubię bigosu, nie piję kawy, nie jem mięsa)»)"], "status": "ok"}, "R2": {"refs": ["DZA («Genitive in existential negation»: Ojca nie ma w domu)", "ELA («Existential nie ma + genitive»)", "ELB (ошибка *Nie jest mleka / *On nie jest tu)", "APA (с. 15: nie ma в значении «находиться где-то»)", "PP s. 40 («c) gdy mówimy, że czegoś nie ma (nie ma chleba, nie ma bułki, nie ma masła)»)", "PP s. 41 («Czego już nie ma? … Nie ma już …»)"], "status": "ok"}, "R3": {"refs": ["DZA («Modals and infinitive complements»: Nie mogę pić piwa)", "APA (с. 13: «direct object which is directly or indirectly dependent on the negated verb»)"], "status": "ok"}, "R4": {"refs": ["ELA («What does not change»)", "ELB («Exceptions»)"], "status": "ok"}, "R5": {"refs": ["ELA («Subjects stay nominative»)", "ELB («Subjects stay nominative»)"], "status": "ok"}, "R6": {"refs": ["VTA («Other cases unchanged»: Nie jestem studentem)"], "status": "marked"}, "R7": {"refs": ["ELA (Lubię tę książkę → Nie lubię tej książki)", "ELB («Typical mistakes»: tego adresu, tych jabłek, pieniędzy)", "PP s. 40 («(nie ma) dobrego rosołu, słodkiego ciasta … dobrej kawy, słodkiej herbaty»)"], "status": "ok"}, "R8": {"refs": ["ELA («psa is unchanged…», «feminine -ę becomes -y or -i»)", "VTA («Masculine animate nouns… look the same»)"], "status": "ok"}, "R9": {"refs": ["ELA («Pronoun objects»)", "VTA (пример с niczego (coś → nic, Dopełniacz))"], "status": "ok"}, "R10": {"refs": ["ELB («Negative words not triggering the rule»: Nigdy nie pijesz wina?)", "VTA («Double negation»: Nikt nie przyszedł; Nikt nie je niczego)"], "status": "ok"}, "R11": {"refs": ["VTA («constituent negation»)"], "status": "marked"}}, "sources": {"STD": "Dz.U. 2025 poz. 217 (файл проекта D20250217.pdf)", "DZA": "K. Dziwirek (University of Washington), Polish Grammar: «Uses of the genitive» — «Genitive of negation», «Genitive in existential negation»: https://faculty.washington.edu/dziwirek/grammar/nouns/polish-uses-of-gen.pdf", "ELA": "elon.io Polish grammar: «Negation Changes the Object Case»: https://elon.io/grammar/polish/negation/genitive-of-negation-recap", "ELB": "elon.io Polish grammar: «Forgetting the Genitive of Negation» (typical mistakes): https://elon.io/grammar/polish/mistakes/forgetting-genitive-of-negation", "PIA": "polski.info — Grammar: Nouns, раздел «Accusative» (#nouns8): https://polski.info/grammar/nouns#nouns8", "VTA": "Varsity Tutors, Conversational Polish: «Using negation»: https://internal.varsitytutors.com/practice/subjects/polish/lessons/using-negation", "APA": "M. Gębka-Wolak, «Between Genitive and Accusative Uses…», Poznańskie Studia Polonistyczne. Seria Językoznawcza 31 (2024), nr 1: https://pressto.amu.edu.pl/index.php/pspsj/article/download/43962/36587/102195", "KEY": "Официальные ключи комиссии: сборник B1 2017 (tests/b1-sbornik.js) и экзамены 2017–2024 (tests/b1-*.js) — найдено поиском по заданиям раздела Gramatyka", "MORF": "Morfeusz 2 (SGJP) — проверка польских слов скриптом tools/morfeusz_check.py", "PP": "Gramatyka z kulturą. Przez przypadki (файл проекта 142944-gramatyka-z-kultura.pdf)"}, "checked": "24.10.2026"}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const T = D.topic, F = D.facts, SRC = D.sources;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // [[…]] — польский текст, **…** — выделение
  const rich = s => esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="pl">$1</span>').replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s;)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  // раскрыть сокращения источников (PO, JPBG…) один раз на раздел
  const abbr = Object.keys(SRC);
  function refsFor(ids){
    const out = [], used = new Set();
    ids.forEach(id => {
      const refs = id === 'EXAM' ? T.exam_ref.refs : (F[id] ? F[id].refs : []);
      refs.forEach(r => { out.push(r); abbr.forEach(a => { if (new RegExp('(^|[^A-ZŁ])'+a+'([^A-ZŁ]|$)').test(r)) used.add(a); }); });
    });
    const legend = [...used].map(a => '<b>'+a+'</b> — '+SRC[a]);
    return {out, legend};
  }
  const block = b => {
    switch(b.type){
      case 'p': return '<p>'+rich(b.text)+'</p>';
      case 'note': return b.kind === 'mark'
        ? '<div class="note mark"><b>С пометкой</b>'+rich(b.text)+'</div>'
        : '<div class="note tip">'+rich(b.text)+'</div>';
      case 'chips': return '<div class="chips">'+b.items.map(i=>'<span>'+esc(i)+'</span>').join('')+'</div>';
      case 'ex': return '<div class="ex">'+b.items.map(i=>'<div><div class="pl">'+esc(i.pl)+'</div><div class="ru">'+esc(i.ru)+'</div></div>').join('')+'</div>';
      case 'fix': return '<div class="fix">'+b.items.map(i=>'<span class="bad">'+esc(i.bad)+'</span><span class="arr" aria-hidden="true">→</span><span class="good">'+esc(i.good)+'</span>').join('')+'</div>';
      case 'steps': return '<ol class="steps">'+b.items.map(i=>'<li>'+rich(i)+'</li>').join('')+'</ol>';
      case 'table': {
        const pc = new Set(b.pl_cols || []);
        const head = b.head.some(h=>h) ? '<thead><tr>'+b.head.map(h=>'<th>'+rich(h)+'</th>').join('')+'</tr></thead>' : '';
        const rows = b.rows.map(r=>'<tr>'+r.map((c,i)=>{
          const lab = i===0 && b.head[0]==='' ;
          const cls = lab ? 'lab'+(pc.has(i)?' pl':'') : (pc.has(i)?'pl':'');
          return '<td'+(cls?' class="'+cls+'"':'')+'>'+(pc.has(i)?esc(c.replace(/\[\[|\]\]/g,'')):rich(c))+'</td>';
        }).join('')+'</tr>').join('');
        return '<div class="tw"><table>'+head+'<tbody>'+rows+'</tbody></table></div>';
      }
    }
    return '';
  };
  let h = '<div class="top"><span class="crumb">Грамматика · '+esc(T.group)+'</span><span class="badge">'+esc(T.level)+'</span></div>'+
    '<header><h1>'+esc(T.title_pl)+'</h1><div class="sub">'+esc(T.title_ru)+'</div><p class="lead">'+esc(T.lead)+'</p></header>'+
    '<div class="draft">Черновик: '+esc(T.stage)+'. Источники — под каждым разделом теории.</div>';
  T.theory.forEach(sec => {
    const r = refsFor(sec.facts);
    h += '<section class="card" id="'+sec.id+'"><h2>'+rich(sec.title)+'</h2>'+sec.blocks.map(block).join('')+
      '<details><summary>Источники · '+r.out.length+'</summary><ul>'+r.out.map(x=>'<li>'+linkify(x)+'</li>').join('')+
      (r.legend.length?'<li style="list-style:none;margin-left:-18px;margin-top:4px">'+r.legend.map(linkify).join('<br>')+'</li>':'')+'</ul></details></section>';
  });
  const EX = T.exercises || [];
  if (EX.length){
    const LV = {1:'Узнать',2:'Образовать',3:'Применить',4:'Свой текст'};
    h += '<h2 class="exh" id="ex">Упражнения</h2>';
    EX.forEach(e => {
      h += '<section class="card" id="'+e.id+'"><div class="lvl">Ступень '+e.level+' · '+LV[e.level]+(e.format==='exam'?' · формат экзамена':'')+'</div><h2>'+(e.kind==='text'||e.kind==='write'?'<span class="pl">'+esc(e.title)+'</span>':esc(e.title))+'</h2>'+
        (e.instr?'<p>'+esc(e.instr)+'</p>':'');
      if (e.kind==='write'){
        h += '<p class="need">'+esc(e.need)+' Объём: '+e.words[0]+'–'+e.words[1]+' слов.</p>'+
          '<textarea id="w-'+e.id+'" lang="pl" spellcheck="false" rows="6" aria-label="Ваш текст"></textarea>'+
          '<div class="score" id="wc-'+e.id+'">0 слов</div>'+
          '<button type="button" class="btn ghost" data-show="'+e.id+'">Показать образец и чек-лист</button>'+
          '<div id="m-'+e.id+'" hidden><div class="model pl">'+esc(e.model)+'</div>'+
          '<p class="score">Нужные формы в образце: <span class="pl">'+e.model_future.map(esc).join(', ')+'</span></p>'+
          '<ul class="check">'+e.checklist.map((c,i)=>'<li><label><input type="checkbox" id="c-'+e.id+'-'+i+'"> '+esc(c)+'</label></li>').join('')+'</ul></div></section>';
        return;
      }
      if (e.kind==='text') h += '<div class="passage pl">'+esc(e.passage).replace(/\{(\d+)\}/g,'<span class="gap">($1)&nbsp;____</span>')+'</div>';
      h += e.items.map((it,i)=>{
          const key=e.id+'-'+i;
          const q=e.kind==='text' ? '('+esc(it.q)+')' : esc(it.q).replace(/\*\*(.+?)\*\*/g,'<span class="bold">$1</span>');
          const body = e.kind==='choice'
            ? '<div class="row">'+it.opts.map(o=>'<button type="button" class="opt" data-k="'+key+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>'
            : '<form class="row" data-k="'+key+'"><input id="in-'+key+'" autocomplete="off" autocapitalize="off" spellcheck="false" lang="pl" aria-label="Ответ"><button class="btn">Проверить</button></form>';
          return '<div class="it"><div class="q">'+(i+1)+'. '+q+'</div>'+body+'<div class="fb" id="fb-'+key+'" hidden></div></div>';
        }).join('')+'<div class="score" id="sc-'+e.id+'"></div></section>';
    });
  }
  h += '<p class="foot">Все польские формы проверены Morfeusz 2 · '+esc(D.checked)+'</p>';
  document.getElementById('app').innerHTML = h;
  const items = {}; EX.forEach(e=>(e.items||[]).forEach((it,i)=>items[e.id+'-'+i]={e,it}));
  const norm = v => v.trim().toLowerCase().replace(/\s+/g,' ');
  const plain = v => norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
  const done = {};
  function show(key, ok, dia){
    const {e,it} = items[key], fb = document.getElementById('fb-'+key);
    const more = it.a.length>1 ? ' Подходят: '+it.a.map(esc).join(', ')+'.' : '';
    fb.className = 'fb '+(ok?'ok':(dia?'dia':'no'));
    fb.innerHTML = ok ? 'Верно. '+esc(it.expl)+more
      : dia ? 'Почти: проверьте диакритику (ą, ę, ł, ś, ź, ż…).'
      : 'Нет. Правильно: <span class="pl">'+esc(it.a[0])+'</span>. '+esc(it.expl)+more+' <a href="#'+it.t+'">К правилу</a>';
    fb.hidden = false;
    if (!dia){ done[key]=ok; const n=e.items.length, k=Object.keys(done).filter(x=>x.startsWith(e.id+'-')), r=k.filter(x=>done[x]).length;
      document.getElementById('sc-'+e.id).textContent = 'Отвечено '+k.length+' из '+n+', верно '+r+'.'; }
  }
  document.getElementById('app').addEventListener('input', ev => {
    const t = ev.target; if (t.tagName!=='TEXTAREA') return;
    const id = t.id.slice(2), n = (t.value.match(/[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+/g)||[]).length, e = EX.find(x=>x.id===id);
    document.getElementById('wc-'+id).textContent = n+' слов'+(n<e.words[0]?' · мало':n>e.words[1]?' · много':' · в норме');
  });
  document.getElementById('app').addEventListener('click', ev => {
    const sh = ev.target.closest('[data-show]');
    if (sh){ const m=document.getElementById('m-'+sh.dataset.show); m.hidden=!m.hidden; sh.textContent=m.hidden?'Показать образец и чек-лист':'Скрыть образец'; return; }
    const b = ev.target.closest('.opt'); if (!b) return;
    const key=b.dataset.k, {it}=items[key], ok=it.a.includes(b.dataset.v);
    document.querySelectorAll('.opt[data-k="'+key+'"]').forEach(x=>x.classList.remove('ok','no'));
    b.classList.add(ok?'ok':'no'); show(key, ok, false);
  });
  document.getElementById('app').addEventListener('submit', ev => {
    ev.preventDefault(); const f=ev.target, key=f.dataset.k, inp=f.querySelector('input'), {it}=items[key];
    const v=norm(inp.value); if(!v) return;
    const ok = it.a.some(a=>norm(a)===v), dia = !ok && it.a.some(a=>plain(a)===plain(v));
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no'); show(key, ok, dia);
  });

})();
</script>
