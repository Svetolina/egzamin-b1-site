й части ale/jednak НЕ добавляется: Chociaż…", "t": "t5"}, {"q": "Mimo ___ jestem optymistką. (всё)", "a": ["wszystko"], "expl": "Уступка: chociaż, choć, mimo że, pomimo że («хотя») + придаточное; в главной части ale/jednak НЕ добавляется: Chociaż…", "t": "t5"}]}, {"id": "e5", "title": "Исправьте ошибку", "instr": "Напечатайте правильный вариант вместо пропуска.", "level": 2, "kind": "type", "items": [{"q": "Bo był zmęczony, poszedł spać. → ___ był zmęczony, poszedł spać.", "a": ["Ponieważ"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Zostałem w domu, **ponieważ że** padało. → Zostałem w domu, ___ padało.", "a": ["ponieważ", "bo", "gdyż"], "expl": "Причина: ponieważ / bo / gdyż — без że.", "t": "t1"}, {"q": "Chociaż padało, ale wyszliśmy na spacer. → Chociaż padało, ___ na spacer.", "a": ["wyszliśmy"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Nie poszedłem, **bo deszcz**. → Nie poszedłem, bo ___ deszcz.", "a": ["padał"], "expl": "После bo — целое предложение с глаголом: bo padał deszcz.", "t": "t1"}, {"q": "Zostaliśmy w domu, dlatego padało. → Padało, ___ zostaliśmy w domu.", "a": ["więc", "dlatego"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Mimo deszcz poszliśmy na spacer. → Mimo ___ poszliśmy na spacer.", "a": ["deszczu"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Był zmęczony, bo poszedł spać. → Był zmęczony, ___ poszedł spać.", "a": ["więc", "dlatego"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Album mimo, że został nagrany dawno, jest popularny. → Album, ___ został nagrany dawno, jest popularny.", "a": ["mimo że", "choć", "chociaż"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}]}, {"id": "e6", "title": "Соедините предложения", "instr": "Соедините два пре godnie temu kupiłam w Państwa sklepie pralkę. {2} była nowa, po tygodniu przestała działać. Dzwoniłam do serwisu, {3} nikt nie odbierał. Mimo {4} nie udało mi się z nikim porozmawiać. {5} nie mam pralki, muszę prać u sąsiadki. Z powodu {6} musiałam przełożyć urlop, {7} cały tydzień czekałam na technika. Technik w końcu przyszedł, {8} nie naprawił pralki, {9} nie miał potrzebnej części. {10} proszę o wymianę pralki na nową. Mam nadzieję, że dzięki {11} sprawa zostanie szybko załatwiona. {12} wszystko jestem zadowolona z wcześniejszych zakupów w Państwa sklepie. Z poważaniem, Anna Nowak", "items": [{"q": "потому что", "a": ["ponieważ", "gdyż"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "хотя", "a": ["Chociaż", "Choć", "Mimo że", "Pomimo że"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "но", "a": ["ale", "lecz"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "wiele prób", "a": ["wielu prób"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "поскольку", "a": ["Ponieważ"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "awaria", "a": ["awarii"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "так как", "a": ["ponieważ", "gdyż"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "однако", "a": ["jednak", "ale", "lecz"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "так как", "a": ["ponieważ", "gdyż"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "поэтому", "a": ["Dlatego", "Zatem"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Państwa szybka reakcja", "a": ["Państwa szybkiej reakcji"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "несмотря на", "a": ["Mimo", "Pomimo"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}]}, {"id": "e8", "title": "Przekształcenia", "instr": "Перестройте предложение, сохранив смысл. Напечатайте пропущенную часть.", "format": "exam", "level": 3, "kind": "type", "items": [{"q": "Ponieważ padał deszcz, mecz odwołano. → Mecz odwołano z powodu ___.", "a": ["deszczu"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Chociaż był zmęczony, skończył pracę. → Mimo ___ skończył pracę.", "a": ["zmęczenia"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Mimo choroby poszła do pracy. → Mimo że była ___, poszła do pracy.", "a": ["chora"], "expl": "Mimo że + целое предложение: mimo że była chora.", "t": "t5"}, {"q": "Zdałem egzamin, bo mi pomogłeś. → Zdałem egzamin dzięki twojej ___.", "a": ["pomocy"], "expl": "dzięki + celownik: twojej pomocy.", "t": "t4"}, {"q": "Ponieważ był korek, spóźniliśmy się. → Spóźniliśmy się przez ___.", "a": ["korek"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Mimo złej pogody pojechaliśmy nad morze. → ___ pogoda była zła, pojechaliśmy nad morze.", "a": ["Chociaż", "Choć", "Mimo że", "Pomimo że"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Był zmęczony, więc poszedł spać. → Poszedł spać, ___ był zmęczony.", "a": ["bo", "ponieważ", "gdyż"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}, {"q": "Nie mam czasu, dlatego nie przyjdę. → ___ nie mam czasu, nie przyjdę.", "a": ["Ponieważ"], "expl": "Причина: bo, ponieważ, gdyż («потому что»); перед ними — запятая.", "t": "t1"}]}, {"id": "e9", "level": 4, "kind": "write", "title": "Рекламация", "instr": "Napisz list z reklamacją (100–120 słów) do biura podróży: wycieczka nie była taka, jak w ofercie. Opisz problemy, ich przyczyny i skutki, napisz, czego oczekujesz.", "words": [100, 120], "need": "Официальные ponieważ, gdyż, zatem; z powodu + родительный; уступка (chociaż, mimo że, mimo + родительный); dlatego или więc; без bo в начале предложения.", "model": "Szanowni Państwo,\npiszę do Państwa, ponieważ jestem niezadowolona z wycieczki do Grecji, którą kupiłam w Państwa biurze. W ofercie był hotel przy plaży, jednak mieszkaliśmy dwa kilometry od morza. Codziennie musieliśmy jeździć autobusem, dlatego traciliśmy dużo czasu. Z powodu remontu basen był zamknięty przez cały tydzień. Chociaż płaciliśmy za wycieczki z przewodnikiem, przewodnik dwa razy nie przyszedł, gdyż był chory. Hotel był też głośny z powodu dyskoteki obok. Mimo naszych próśb nikt nie zaproponował nam innego rozwiązania. Wycieczka nie była zatem taka, jak w ofercie. Mimo że rozumiem trudności, oczekuję zwrotu części pieniędzy, więc proszę o szybką odpowiedź. Liczę na zrozumienie.\nZ poważaniem\nOksana Melnyk", "model_future": ["ponieważ", "dlatego", "z powodu remontu", "chociaż", "gdyż", "mimo naszych próśb", "zatem", "mimo że", "więc"], "checklist": ["официальные союзы: ponieważ, gdyż, zatem", "1 конструкция z powodu + D.", "1 уступка: chociaż / mimo że / mimo + D.", "dlatego / więc для следствия", "без bo в начале предложения", "100–120 слов"], "t": "t1", "items": []}, {"id": "e10", "level": 4, "kind": "write", "title": "Работа из дома: за и против", "instr": "Napisz wpis na forum (80–100 słów): czy praca zdalna jest lepsza od pracy w biurze? Podaj argumenty za i przeciw, napisz swoje zdanie.", "words": [80, 100], "need": "Две причины (bo, ponieważ), две уступки (chociaż, mimo + родительный), mimo to или jednak, dzięki + дательный, вывод с więc или dlatego.", "model": "Praca zdalna — tak czy nie?\nOd roku pracuję z domu i jestem zadowolona, bo nie tracę czasu na dojazdy. Dzięki temu mam więcej czasu dla rodziny. Pracuję też spokojni ", "KEY: więc (2020, 02.2023, 04.2023, 11.2023, 04.2024), dlatego (01.2021, 05.2021, 06.2021, 06.2022)"], "status": "ok"}, "R5": {"refs": ["ELA (раздел Causes With Nouns)", "JPBG XI s. 207 (замена: «Nie poszłam na spacer, bo padał deszcz. (z powodu)»; «… ze względu na brak towaru»)"], "status": "ok"}, "R6": {"refs": ["ELC (раздел о chociaż / mimo że; ошибка «Chociaż padało, ale…»)", "XXC (mimo że — spójnik, «obwohl»)", "ELD (пример)", "KEY: chociaż (11.2021, 02.2022; сборник 12.VI, k12-6)", "JPBG XI s. 207 («Chociaż miał dobre chęci, nie zdążył zrobić prezentacji» — без ale в главной части)"], "status": "ok"}, "R7": {"refs": ["XXD (правило о przecinku przed całym wyrażeniem)"], "status": "marked"}, "R8": {"refs": ["XXC (mimo — przyimek + dopełniacz; mimo wszystko)", "ELE (пример)", "JPBG XI s. 207 («Chociaż miał dobre chęci… (mimo)» → mimo + dopełniacz)"], "status": "ok"}, "R9": {"refs": ["XXC (mimo to — «trotzdem»)", "ELC (jednak — «can open the clause or sit inside it»)", "XXA (jednak «often starts a sentence»)", "ZJP s. 91 («Przeciwstawne: ale, lecz, jednak, a, zaś, natomiast»; «Miał padać deszcz, jednak niebo było bezchmurne»)", "KEY: jednak (03.2022, Gramatyka II)"], "status": "ok"}, "R10": {"refs": ["ELC (ale, lecz; ошибка без запятой)", "XXA (ale «between clauses»)", "ZJP s. 91 (przeciwstawne: ale, lecz)", "KEY: ale (2020, 05.2021, 06.2022, 11.2023, 04.2024), lecz (2019, 02.2023, 02.2024)"], "status": "ok"}}, "sources": {"STD": "Dz.U. 2025 poz. 217 (файл проекта D20250217.pdf)", "ELA": "elon.io — «Cause and result: bo, ponieważ, więc, dlatego»: https://elon.io/grammar/polish/conjunctions/cause-result", "ELB": "elon.io — «Connecting ideas»: https://elon.io/grammar/polish/expressions/connecting-ideas", "XXA": "Vaia — «Polish Sentence Connectors»: https://vaia.com/en-us/explanations/polish/polish-syntax/polish-sentence-connectors", "XXB": "K. Bakuła, «Bo v. ponieważ i inne spójniki w mówionym i pisanym», Z Teorii i Praktyki Dydaktycznej Języka Polskiego t. 30, 2021: https://journals.us.edu.pl/index.php/TPDJP/article/download/12879/9990", "ELC": "elon.io — «Contrast and Condition: ale, jednak, chociaż…»: https://elon.io/grammar/polish/conjunctions/contrast-condition", "XXC": "Langenscheidt Polish–German — «mimo»: https://en.langenscheidt.com/polish-german/mimo", "ELD": "elon.io — пример «Mimo że pada deszcz, idę na spacer»: https://elon.io/learn-hardcore-polish/lexicon/500813/mimo-że-pada-deszcz-idę-na-spacer.", "XXD": "NCK / Ojczysty — dodaj do ulubionych: «Mimo że, pomimo że»: https://nck.pl/projekty-kulturalne/projekty/ojczysty-dodaj-do-ulubionych/ciekawostki-jezykowe/mimo-ze-pomimo-ze-.ajax", "ELE": "elon.io — пример «Idę na spacer mimo deszczu»: https://elon.io/learn-hardcore-polish/lexicon/500867/idę-na-spacer-mimo-deszczu.", "KEY": "Официальные ключи комиссии: сборник B1 2017 (tests/b1-sbornik.js) и экзамены 2017–2024 (tests/b1-*.js) — найдено поиском по заданиям раздела Gramatyka", "MORF": "Morfeusz 2 (SGJP) — проверка польских слов скриптом tools/morfeusz_check.py", "JPBG XI": "Język polski bez granic, kl. XI (B2) (файлы проекта kl.-XI-*.pdf)", "ZJP": "Z językiem polskim każdego dnia – B1, podręcznik (файлы проекта Podręcznik_…B1-*.pdf)"}, "checked": "24.10.2026"}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const T = D.topic, F = D.facts, SRC = D.sources;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // [[…]] — польский текст, **…** — выделение
  const rich = s => esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="pl">$1</span>').replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s;)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  // раскрыть сокращения источников (PO, JPBG…) один раз на раздел
  const abbr = Object.keys(SRC);
  function refsFor(ids){
    const out = [], used = new Set();
    ids.forEach(id => {
      const refs = id === 'EXAM' ? T.exam_ref.refs : (F[id] ? F[id].refs : []);
      refs.forEach(r => { out.push(r); abbr.forEach(a => { if (new RegExp('(^|[^A-ZŁ])'+a+'([^A-ZŁ]|$)').test(r)) used.add(a); }); });
    });
    const legend = [...used].map(a => '<b>'+a+'</b> — '+SRC[a]);
    return {out, legend};
  }
  const block = b => {
    switch(b.type){
      case 'p': return '<p>'+rich(b.text)+'</p>';
      case 'note': return b.kind === 'mark'
        ? '<div class="note mark"><b>С пометкой</b>'+rich(b.text)+'</div>'
        : '<div class="note tip">'+rich(b.text)+'</div>';
      case 'chips': return '<div class="chips">'+b.items.map(i=>'<span>'+esc(i)+'</span>').join('')+'</div>';
      case 'ex': return '<div class="ex">'+b.items.map(i=>'<div><div class="pl">'+esc(i.pl)+'</div><div class="ru">'+esc(i.ru)+'</div></div>').join('')+'</div>';
      case 'fix': return '<div class="fix">'+b.items.map(i=>'<span class="bad">'+esc(i.bad)+'</span><span class="arr" aria-hidden="true">→</span><span class="good">'+esc(i.good)+'</span>').join('')+'</div>';
      case 'steps': return '<ol class="steps">'+b.items.map(i=>'<li>'+rich(i)+'</li>').join('')+'</ol>';
      case 'table': {
        const pc = new Set(b.pl_cols || []);
        const head = b.head.some(h=>h) ? '<thead><tr>'+b.head.map(h=>'<th>'+rich(h)+'</th>').join('')+'</tr></thead>' : '';
        const rows = b.rows.map(r=>'<tr>'+r.map((c,i)=>{
          const lab = i===0 && b.head[0]==='' ;
          const cls = lab ? 'lab'+(pc.has(i)?' pl':'') : (pc.has(i)?'pl':'');
          return '<td'+(cls?' class="'+cls+'"':'')+'>'+(pc.has(i)?esc(c.replace(/\[\[|\]\]/g,'')):rich(c))+'</td>';
        }).join('')+'</tr>').join('');
        return '<div class="tw"><table>'+head+'<tbody>'+rows+'</tbody></table></div>';
      }
    }
    return '';
  };
  let h = '<div class="top"><span class="crumb">Грамматика · '+esc(T.group)+'</span><span class="badge">'+esc(T.level)+'</span></div>'+
    '<header><h1>'+esc(T.title_pl)+'</h1><div class="sub">'+esc(T.title_ru)+'</div><p class="lead">'+esc(T.lead)+'</p></header>'+
    '<div class="draft">Черновик: '+esc(T.stage)+'. Источники — под каждым разделом теории.</div>';
  T.theory.forEach(sec => {
    const r = refsFor(sec.facts);
    h += '<section class="card" id="'+sec.id+'"><h2>'+rich(sec.title)+'</h2>'+sec.blocks.map(block).join('')+
      '<details><summary>Источники · '+r.out.length+'</summary><ul>'+r.out.map(x=>'<li>'+linkify(x)+'</li>').join('')+
      (r.legend.length?'<li style="list-style:none;margin-left:-18px;margin-top:4px">'+r.legend.map(linkify).join('<br>')+'</li>':'')+'</ul></details></section>';
  });
  const EX = T.exercises || [];
  if (EX.length){
    const LV = {1:'Узнать',2:'Образовать',3:'Применить',4:'Свой текст'};
    h += '<h2 class="exh" id="ex">Упражнения</h2>';
    EX.forEach(e => {
      h += '<section class="card" id="'+e.id+'"><div class="lvl">Ступень '+e.level+' · '+LV[e.level]+(e.format==='exam'?' · формат экзамена':'')+'</div><h2>'+(e.kind==='text'||e.kind==='write'?'<span class="pl">'+esc(e.title)+'</span>':esc(e.title))+'</h2>'+
        (e.instr?'<p>'+esc(e.instr)+'</p>':'');
      if (e.kind==='write'){
        h += '<p class="need">'+esc(e.need)+' Объём: '+e.words[0]+'–'+e.words[1]+' слов.</p>'+
          '<textarea id="w-'+e.id+'" lang="pl" spellcheck="false" rows="6" aria-label="Ваш текст"></textarea>'+
          '<div class="score" id="wc-'+e.id+'">0 слов</div>'+
          '<button type="button" class="btn ghost" data-show="'+e.id+'">Показать образец и чек-лист</button>'+
          '<div id="m-'+e.id+'" hidden><div class="model pl">'+esc(e.model)+'</div>'+
          '<p class="score">Нужные формы в образце: <span class="pl">'+e.model_future.map(esc).join(', ')+'</span></p>'+
          '<ul class="check">'+e.checklist.map((c,i)=>'<li><label><input type="checkbox" id="c-'+e.id+'-'+i+'"> '+esc(c)+'</label></li>').join('')+'</ul></div></section>';
        return;
      }
      if (e.kind==='text') h += '<div class="passage pl">'+esc(e.passage).replace(/\{(\d+)\}/g,'<span class="gap">($1)&nbsp;____</span>')+'</div>';
      h += e.items.map((it,i)=>{
          const key=e.id+'-'+i;
          const q=e.kind==='text' ? '('+esc(it.q)+')' : esc(it.q).replace(/\*\*(.+?)\*\*/g,'<span class="bold">$1</span>');
          const body = e.kind==='choice'
            ? '<div class="row">'+it.opts.map(o=>'<button type="button" class="opt" data-k="'+key+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>'
            : '<form class="row" data-k="'+key+'"><input id="in-'+key+'" autocomplete="off" autocapitalize="off" spellcheck="false" lang="pl" aria-label="Ответ"><button class="btn">Проверить</button></form>';
          return '<div class="it"><div class="q">'+(i+1)+'. '+q+'</div>'+body+'<div class="fb" id="fb-'+key+'" hidden></div></div>';
        }).join('')+'<div class="score" id="sc-'+e.id+'"></div></section>';
    });
  }
  h += '<p class="foot">Все польские формы проверены Morfeusz 2 · '+esc(D.checked)+'</p>';
  document.getElementById('app').innerHTML = h;
  const items = {}; EX.forEach(e=>(e.items||[]).forEach((it,i)=>items[e.id+'-'+i]={e,it}));
  const norm = v => v.trim().toLowerCase().replace(/\s+/g,' ');
  const plain = v => norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
  const done = {};
  function show(key, ok, dia){
    const {e,it} = items[key], fb = document.getElementById('fb-'+key);
    const more = it.a.length>1 ? ' Подходят: '+it.a.map(esc).join(', ')+'.' : '';
    fb.className = 'fb '+(ok?'ok':(dia?'dia':'no'));
    fb.innerHTML = ok ? 'Верно. '+esc(it.expl)+more
      : dia ? 'Почти: проверьте диакритику (ą, ę, ł, ś, ź, ż…).'
      : 'Нет. Правильно: <span class="pl">'+esc(it.a[0])+'</span>. '+esc(it.expl)+more+' <a href="#'+it.t+'">К правилу</a>';
    fb.hidden = false;
    if (!dia){ done[key]=ok; const n=e.items.length, k=Object.keys(done).filter(x=>x.startsWith(e.id+'-')), r=k.filter(x=>done[x]).length;
      document.getElementById('sc-'+e.id).textContent = 'Отвечено '+k.length+' из '+n+', верно '+r+'.'; }
  }
  document.getElementById('app').addEventListener('input', ev => {
    const t = ev.target; if (t.tagName!=='TEXTAREA') return;
    const id = t.id.slice(2), n = (t.value.match(/[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+/g)||[]).length, e = EX.find(x=>x.id===id);
    document.getElementById('wc-'+id).textContent = n+' слов'+(n<e.words[0]?' · мало':n>e.words[1]?' · много':' · в норме');
  });
  document.getElementById('app').addEventListener('click', ev => {
    const sh = ev.target.closest('[data-show]');
    if (sh){ const m=document.getElementById('m-'+sh.dataset.show); m.hidden=!m.hidden; sh.textContent=m.hidden?'Показать образец и чек-лист':'Скрыть образец'; return; }
    const b = ev.target.closest('.opt'); if (!b) return;
    const key=b.dataset.k, {it}=items[key], ok=it.a.includes(b.dataset.v);
    document.querySelectorAll('.opt[data-k="'+key+'"]').forEach(x=>x.classList.remove('ok','no'));
    b.classList.add(ok?'ok':'no'); show(key, ok, false);
  });
  document.getElementById('app').addEventListener('submit', ev => {
    ev.preventDefault(); const f=ev.target, key=f.dataset.k, inp=f.querySelector('input'), {it}=items[key];
    const v=norm(inp.value); if(!v) return;
    const ok = it.a.some(a=>norm(a)===v), dia = !ok && it.a.some(a=>plain(a)===plain(v));
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no'); show(key, ok, dia);
  });

})();
</script>
