ислительное и месяц в родительном. «Какое сегодня число?» — числительное в именительном, месяц всё равно в родительном:"}, {"type": "ex", "items": [{"pl": "Urodziłam się piątego października.", "ru": "Я родилась пятого октября."}, {"pl": "Dziś jest pierwszy maja.", "ru": "Сегодня первое мая."}]}]}, {"id": "t14", "title": "Нет и не", "facts": ["D20"], "blocks": [{"type": "p", "text": "[[Nie ma / nie było / nie będzie]] + родительный: [[Nie ma sera.]] Прямое дополнение после [[nie]] тоже идёт в родительный: [[Lubię kawę. → Nie lubię kawy.]]"}, {"type": "note", "kind": "tip", "text": "Подробно, с исключениями, — в теме «Родительный при отрицании»."}]}, {"id": "t15", "title": "На экзамене", "facts": ["EXAM"], "blocks": [{"type": "p", "text": "В задании «поставьте слова в нужную форму» родительный встречается почти в каждом тексте: после [[nie ma]], после [[do, z, bez, dla]], после [[życzyć]] (сборник 2017: [[życzę zdrowia, szczęścia, powodzenia]]) и в цепочках «чей»: [[opowieści pana Antoniego]]."}, {"type": "steps", "items": ["Перед словом [[nie]], предлог [[do, od, z, bez, dla, u]], глагол [[szukać, życzyć, słuchać]], мера или [[dużo, mało]]? — родительный.", "Женский: твёрдая согласная → [[-y]], [[k, g]], мягкая, [[l, j]] → [[-i]].", "Мужской: живое → [[-a]]; неживое → [[-u]] или [[-a]] (месяцы, предметы — [[-a]]).", "Прилагательное: [[-ego]] / [[-ej]]."]}]}], "exercises": [{"id": "e1", "level": 1, "kind": "choice", "title": "Выберите форму", "items": [{"q": "Poproszę szklankę ___.", "a": ["wody"], "expl": "Жен., твёрдая d → -y.", "t": "t2", "opts": ["woda", "wody", "wodę"]}, {"q": "Nie mam ___ na kino.", "a": ["czasu"], "expl": "Абстрактное, муж. → -u.", "t": "t5", "opts": ["czas", "czasa", "czasu"]}, {"q": "Jutro idę do ___.", "a": ["lekarza"], "expl": "Человек → -a.", "t": "t4", "opts": ["lekarz", "lekarza", "lekarzu"]}, {"q": "Szukam ___ do mieszkania.", "a": ["klucza"], "expl": "Небольшой предмет → -a.", "t": "t6", "opts": ["klucz", "klucza", "kluczu"]}, {"q": " ожение так, чтобы смысл не изменился. Впишите одно слово.", "items": [{"q": "Ten telefon należy do Anny. → To jest telefon ___.", "a": ["Anny"], "expl": "Чей? — родительный после главного слова.", "t": "t13"}, {"q": "W lodówce nie zostało mleko. → W lodówce nie ma już ___.", "a": ["mleka"], "expl": "Nie ma + родительный.", "t": "t14"}, {"q": "Kupiłam jeden litr soku i kawałek sera. → Kupiłam litr ___ i kawałek sera.", "a": ["soku"], "expl": "Мера + родительный.", "t": "t13"}, {"q": "Kupiłam mamie prezent. → Kupiłam prezent dla ___.", "a": ["mamy"], "expl": "Dla + родительный.", "t": "t12"}, {"q": "Mam niewiele czasu. → Mam mało ___.", "a": ["czasu"], "expl": "Mało + родительный.", "t": "t13"}, {"q": "Mieszkam obok parku. → Mieszkam koło ___.", "a": ["parku"], "expl": "Koło + родительный.", "t": "t12"}, {"q": "Urodziłem się 3 maja. → Urodziłem się trzeciego ___.", "a": ["maja"], "expl": "Месяц в дате — родительный.", "t": "t13"}]}, {"id": "e10", "level": 4, "kind": "write", "title": "Lista zakupów i życzenia", "instr": "Напишите соседке записку: попросите купить вам продукты (что и сколько) и поздравьте её с днём рождения.", "words": [40, 50], "need": "Не меньше 8 форм родительного: хотя бы три «мера + продукт», один предлог с родительным, одно пожелание (życzę…) и одно «nie ma…».", "model": "Droga Pani Ewo! Czy mogłaby Pani kupić mi w sklepie butelkę mleka, kilo cukru i paczkę herbaty? Nie mam już też chleba. Pieniądze zostawiłam u syna. Bardzo dziękuję! I wszystkiego najlepszego z okazji urodzin! Życzę Pani zdrowia i dużo radości. Marta z drugiego piętra", "model_future": ["mleka", "cukru", "herbaty", "chleba", "syna", "urodzin", "zdrowia", "radości", "piętra"], "checklist": ["Есть обращение и подпись", "Сказано, что и сколько купить (butelkę mleka…)", "Не меньше 8 форм родительного", "Есть предлог с родительным (u, do, z, dla…)", "Есть «nie ma / nie mam…»", "Есть пожелание: życzę + родительный", "Женский: -y / -i, мужской: -a / -u", "40–50 слов"], "t": "t1"}]}, "facts": {"D1": {"refs": ["PP s. 40 («Dopełniacza używamy: a) gdy mówimy, ile czegoś jest… b) czyje to jest… c) że czegoś nie ma… d) negacji biernika… e) daty… g) po niektórych czasownikach… h) po przyimkach»)", "STD B1 2.2.3 pkt 1 lit. b, s. 77 (Książka Iwony; filiżankę kawy; Szuka większego mieszkania; Wracają z Krakowa do Warszawy; Studentów nie było)", "KURS (dom mamy, pierwszy maja, nie ma Anny)"], "status": "ok"}, "D2": {"refs": ["PP s. 38–39 (таблица: «-i po spółgłoskach miękkich, po -l oraz po -k, -g»; «-y po spółgłoskach twardych i stwardniałych»: wody, zupy, herbaty; z ulicy, kaszy; mąki, szynki, książki; dla babci, z kuchni)", "ZPE (таблица: D. żony)", "KURS (mama → mamy, burza → burzy, matka → matki)", "KEY k1-2 (urody, trucicielki), k1-3 (pracy)", "MORF"], "status": "ok"}, "D3": {"refs": ["PP s. 39 (-i po spółgłoskach miękkich: bez soli, z Łodzi; -y po stwardniałych: ciszy, pomarańczy)", "KEY k1-7 (radości, miłości)", "MORF"], "status": "ok"}, "D4": {"refs": ["PP s. 39 (**: «Rzeczowniki obcego pochodzenia zakończone na -ia w dopełniaczu l. poj. kończą się na -ii (z Austrii, Hiszpanii, Irlandii…)»)", "KURS (amnestia → amnestii, lekcja → lekcji)", "MORF"], "status": "ok"}, "D5": {"refs": ["KURS (pani → pani)", "MORF"], "status": "ok"}, "D6": {"refs": ["PP s. 39 («rzeczowniki rodzaju męskiego żywotnego (nie ma dyrektora, kucharza, kelnera, kurczaka, łososia, śledzia)»)", "KURS (ojciec → ojca, syn, brat → brata)", "KEY k1-7 (przykład: nie ma psa), k1-8 (pana Antoniego)", "MORF"], "status": "ok"}, "D7": {"refs": ["PP s. 38 (заголовок таблицы: «rodzaj żeński (i słowa rodzaju męskiego zakończone na -a)»)", "KURS («tata → taty»)", "MORF"], "status": "ok"}, "D8": {"refs": ["PP s. 39 (-u: «a) często: substancje, rzeczy niepoliczalne, abstrakcyjne… b) nazwy obce… c) nazwy dni tygodnia… d) -unek… e) -izm»)", "STEF (по Westfalowi: -u у веществ, абстрактного, предметов больше человека; -unek, -izm)", "KEY k1-1 (ruchu), k1-3 (hałasu), k11-6 (kontaktu), k1-8 (domu)", "MO tatus": "ok"}, "D15": {"refs": ["PP s. 40 (h: «do, od, dla, u, z, bez, obok, koło, dookoła, wokół, spod, znad, według, podczas, oprócz, zamiast, z okazji, z powodu…»), s. 43 (упр. 10: według, oprócz, bez, do, dookoła, z, dla, od, zamiast)", "STD B1 s. 77 (Wracają z Krakowa do Warszawy. Apteka jest obok szpitala. Jestem bez pracy. Zrobił to dla kariery.); A2 s. 68 (Piotr mieszka u mnie. Spotkajmy się około piątej.)", "ZJP podręcznik s. 64 («około… + dopełniacz»)", "KEY k1-3 (do swoich zajęć), k1-8 (do swojego domu)"], "status": "ok"}, "D16": {"refs": ["STD B1 s. 77 (z Krakowa; koszulę z bawełny — dopełniacz)", "JPBG9 s. 157 (z… + NARZĘDNIK: bluzka z kieszonką, spacer ze swoją koleżanką)", "PP s. 40 (h: z + dopełniacz), s. 43 (упр. 11: zupa z kury, ser z mleka)"], "status": "ok"}, "D17": {"refs": ["PP s. 40 (a: «kilo cukru, talerz zupy, litr mleka»), s. 36–37 (szklanka herbaty, kostka masła, kromka chleba)", "STD B1 s. 77 (Janek wypił filiżankę kawy.); A2 s. 67 (Mam butelkę wody.)", "JPBG11 s. 100 («dużo, mało, trochę, sporo, mnóstwo… łączą się z rzeczownikiem w dopełniaczu… l. pojedynczej (dla rzeczowników niepoliczalnych typu czas, woda, cukier): Praca ta zajęła mu mało czasu. Dodałaś za dużo cukru.»)"], "status": "ok"}, "D18": {"refs": ["PP s. 40 (b: «komputer Adama, telefon Anny, świat dziecka»)", "STD B1 s. 77 (Książka Iwony leży na stole.); A2 s. 67 (Samochód sąsiada stoi na parkingu.)", "KURS (dom mamy, książka taty)", "KEY k1-8 (opowieści pana Antoniego), k1-3 (centrum Warszawy — przykład)"], "status": "ok"}, "D19": {"refs": ["PP s. 40 (e: «pierwszego stycznia, tamtego dnia»)", "JPBG9 s. 81 («nazwa miesiąca umieszczana przy numerze dnia jest zawsze w dopełniaczu l. poj.: 23.12. – dwudziestego trzeciego grudnia»), s. 83 («Dzisiaj jest dziesiąty listopada… To było dziesiątego listopada»)", "ZJP ćwiczenia s. 10 (zad. 4 «Zapisz słownie daty w dopełniaczu»; таблица: drugi luty → drugiego lutego)", "KURS (pierwszy maja)"], "status": "ok"}, "D20": {"refs": ["PP s. 40 (c: «nie ma chleba, nie ma bułki, nie ma masła»; d: «nie lubię bigosu, nie piję kawy»)", "STD B1 s. 77 (Studentki nie przeczytały tych artykułów. Studentów nie było na tym spotkaniu.)", "KEY k1-1 (nie ma słońca; nie lubimy ruchu), k1-7 (przykład: On nie ma psa)"], "status": "ok"}}, "sources": {"STD": "Dz.U. 2025 poz. 217 (файл проекта D20250217.pdf)", "PP": "Gramatyka z kulturą. Przez przypadki (B. Maliszewski), UMCS 2020, rozdział «Dopełniacz liczby pojedynczej», s. 36–45 (s. 38–39 — окончания существительных, s. 40 — прилагательные, местоимения и употребление, s. 42–43 — глаголы и предлоги в упражнениях)", "JPBG9": "Język polski bez granic, kl. IX (B1, cz. 1), Wspólnota Polska 2020: lekcja 4, s. 81 (даты: название месяца в родительном), lekcja 6, s. 120 (короткие формы местоимений, n- после предлогов), lekcja 8, s. 157 (z + narzędnik), lekcja 9, s. 180 (imię — imienia, szczenię — szczenięcia)", "JPBG11": "Język polski bez granic, kl. XI (B1, cz. 2), Wspólnota Polska: lekcja 5, s. 100 («Wyrazy określające ilość»: dużo, mało, trochę + dopełniacz)", "ZJP": "Z językiem polskim każdego dnia – B1 (UDSC 2023): ćwiczenia s. 10 (lekcja 1C, «Zapisz słownie daty w dopełniaczu»); podręcznik s. 64 (ramka «około… + dopełniacz») — явных правил окончаний нет", "ZPE": "Zintegrowana Platforma Edukacyjna, lekcja «Odmiana rzeczownika i przymiotnika» (таблицы: D. ucznia, żony, okna; dobrego, dobrej): https://zpe.gov.pl/a/odmiana-rzeczownika-i-przymiotnika/DYAl4NsEf", "STEF": "Stefańczyk W.T., «O repartycji końcówek -a i -u w dopełniaczu liczby pojedynczej rodzaju męskiego», Annales UMCS, Sectio FF, vol. XXIV (2006): https://www.dlibra.umcs.lublin.pl/Content/24044/download", "KURS": "Kurs języka polskiego (G. Jagodziński), «Lekcja dziewiąta: Dopełniacz liczby pojedynczej»: https://grzegorj.smallhost.pl/kurs/09.html", "KEY": "Официальный сборник комиссии B1 (2017), Gramatyka: blok 1 (k1-1, k1-2, k1-3, k1-7, k1-8), blok 3 (k3-1), blok 11 (k11-6) — ключ внесён в tests/b1-sbornik.js сайта <script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const T = D.topic, F = D.facts, SRC = D.sources;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // [[…]] — польский текст, **…** — выделение
  const rich = s => esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="pl">$1</span>').replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s;)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  // раскрыть сокращения источников (PO, JPBG…) один раз на раздел
  const abbr = Object.keys(SRC);
  function refsFor(ids){
    const out = [], used = new Set();
    ids.forEach(id => {
      const refs = id === 'EXAM' ? T.exam_ref.refs : (F[id] ? F[id].refs : []);
      refs.forEach(r => { out.push(r); abbr.forEach(a => { if (new RegExp('(^|[^A-ZŁ])'+a+'([^A-ZŁ]|$)').test(r)) used.add(a); }); });
    });
    const legend = [...used].map(a => '<b>'+a+'</b> — '+SRC[a]);
    return {out, legend};
  }
  const block = b => {
    switch(b.type){
      case 'p': return '<p>'+rich(b.text)+'</p>';
      case 'note': return b.kind === 'mark'
        ? '<div class="note mark"><b>С пометкой</b>'+rich(b.text)+'</div>'
        : '<div class="note tip">'+rich(b.text)+'</div>';
      case 'chips': return '<div class="chips">'+b.items.map(i=>'<span>'+esc(i)+'</span>').join('')+'</div>';
      case 'ex': return '<div class="ex">'+b.items.map(i=>'<div><div class="pl">'+esc(i.pl)+'</div><div class="ru">'+esc(i.ru)+'</div></div>').join('')+'</div>';
      case 'fix': return '<div class="fix">'+b.items.map(i=>'<span class="bad">'+esc(i.bad)+'</span><span class="arr" aria-hidden="true">→</span><span class="good">'+esc(i.good)+'</span>').join('')+'</div>';
      case 'steps': return '<ol class="steps">'+b.items.map(i=>'<li>'+rich(i)+'</li>').join('')+'</ol>';
      case 'table': {
        const pc = new Set(b.pl_cols || []);
        const head = b.head.some(h=>h) ? '<thead><tr>'+b.head.map(h=>'<th>'+rich(h)+'</th>').join('')+'</tr></thead>' : '';
        const rows = b.rows.map(r=>'<tr>'+r.map((c,i)=>{
          const lab = i===0 && b.head[0]==='' ;
          const cls = lab ? 'lab'+(pc.has(i)?' pl':'') : (pc.has(i)?'pl':'');
          return '<td'+(cls?' class="'+cls+'"':'')+'>'+(pc.has(i)?esc(c.replace(/\[\[|\]\]/g,'')):rich(c))+'</td>';
        }).join('')+'</tr>').join('');
        return '<div class="tw"><table>'+head+'<tbody>'+rows+'</tbody></table></div>';
      }
    }
    return '';
  };
  let h = '<div class="top"><span class="crumb">Грамматика · '+esc(T.group)+'</span><span class="badge">'+esc(T.level)+'</span></div>'+
    '<header><h1>'+esc(T.title_pl)+'</h1><div class="sub">'+esc(T.title_ru)+'</div><p class="lead">'+esc(T.lead)+'</p></header>'+
    '<div class="draft">Черновик: '+esc(T.stage)+'. Источники — под каждым разделом теории.</div>';
  T.theory.forEach(sec => {
    const r = refsFor(sec.facts);
    h += '<section class="card" id="'+sec.id+'"><h2>'+rich(sec.title)+'</h2>'+sec.blocks.map(block).join('')+
      '<details><summary>Источники · '+r.out.length+'</summary><ul>'+r.out.map(x=>'<li>'+linkify(x)+'</li>').join('')+
      (r.legend.length?'<li style="list-style:none;margin-left:-18px;margin-top:4px">'+r.legend.map(linkify).join('<br>')+'</li>':'')+'</ul></details></section>';
  });
  const EX = T.exercises || [];
  if (EX.length){
    const LV = {1:'Узнать',2:'Образовать',3:'Применить',4:'Свой текст'};
    h += '<h2 class="exh" id="ex">Упражнения</h2>';
    EX.forEach(e => {
      h += '<section class="card" id="'+e.id+'"><div class="lvl">Ступень '+e.level+' · '+LV[e.level]+(e.format==='exam'?' · формат экзамена':'')+'</div><h2>'+(e.kind==='text'||e.kind==='write'?'<span class="pl">'+esc(e.title)+'</span>':esc(e.title))+'</h2>'+
        (e.instr?'<p>'+esc(e.instr)+'</p>':'');
      if (e.kind==='write'){
        h += '<p class="need">'+esc(e.need)+' Объём: '+e.words[0]+'–'+e.words[1]+' слов.</p>'+
          '<textarea id="w-'+e.id+'" lang="pl" spellcheck="false" rows="6" aria-label="Ваш текст"></textarea>'+
          '<div class="score" id="wc-'+e.id+'">0 слов</div>'+
          '<button type="button" class="btn ghost" data-show="'+e.id+'">Показать образец и чек-лист</button>'+
          '<div id="m-'+e.id+'" hidden><div class="model pl">'+esc(e.model)+'</div>'+
          '<p class="score">Нужные формы в образце: <span class="pl">'+e.model_future.map(esc).join(', ')+'</span></p>'+
          '<ul class="check">'+e.checklist.map((c,i)=>'<li><label><input type="checkbox" id="c-'+e.id+'-'+i+'"> '+esc(c)+'</label></li>').join('')+'</ul></div></section>';
        return;
      }
      if (e.kind==='text') h += '<div class="passage pl">'+esc(e.passage).replace(/\{(\d+)\}/g,'<span class="gap">($1)&nbsp;____</span>')+'</div>';
      h += e.items.map((it,i)=>{
          const key=e.id+'-'+i;
          const q=e.kind==='text' ? '('+esc(it.q)+')' : esc(it.q).replace(/\*\*(.+?)\*\*/g,'<span class="bold">$1</span>');
          const body = e.kind==='choice'
            ? '<div class="row">'+it.opts.map(o=>'<button type="button" class="opt" data-k="'+key+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>'
            : '<form class="row" data-k="'+key+'"><input id="in-'+key+'" autocomplete="off" autocapitalize="off" spellcheck="false" lang="pl" aria-label="Ответ"><button class="btn">Проверить</button></form>';
          return '<div class="it"><div class="q">'+(i+1)+'. '+q+'</div>'+body+'<div class="fb" id="fb-'+key+'" hidden></div></div>';
        }).join('')+'<div class="score" id="sc-'+e.id+'"></div></section>';
    });
  }
  h += '<p class="foot">Все польские формы проверены Morfeusz 2 · '+esc(D.checked)+'</p>';
  document.getElementById('app').innerHTML = h;
  const items = {}; EX.forEach(e=>(e.items||[]).forEach((it,i)=>items[e.id+'-'+i]={e,it}));
  const norm = v => v.trim().toLowerCase().replace(/\s+/g,' ');
  const plain = v => norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
  const done = {};
  function show(key, ok, dia){
    const {e,it} = items[key], fb = document.getElementById('fb-'+key);
    const more = it.a.length>1 ? ' Подходят: '+it.a.map(esc).join(', ')+'.' : '';
    fb.className = 'fb '+(ok?'ok':(dia?'dia':'no'));
    fb.innerHTML = ok ? 'Верно. '+esc(it.expl)+more
      : dia ? 'Почти: проверьте диакритику (ą, ę, ł, ś, ź, ż…).'
      : 'Нет. Правильно: <span class="pl">'+esc(it.a[0])+'</span>. '+esc(it.expl)+more+' <a href="#'+it.t+'">К правилу</a>';
    fb.hidden = false;
    if (!dia){ done[key]=ok; const n=e.items.length, k=Object.keys(done).filter(x=>x.startsWith(e.id+'-')), r=k.filter(x=>done[x]).length;
      document.getElementById('sc-'+e.id).textContent = 'Отвечено '+k.length+' из '+n+', верно '+r+'.'; }
  }
  document.getElementById('app').addEventListener('input', ev => {
    const t = ev.target; if (t.tagName!=='TEXTAREA') return;
    const id = t.id.slice(2), n = (t.value.match(/[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+/g)||[]).length, e = EX.find(x=>x.id===id);
    document.getElementById('wc-'+id).textContent = n+' слов'+(n<e.words[0]?' · мало':n>e.words[1]?' · много':' · в норме');
  });
  document.getElementById('app').addEventListener('click', ev => {
    const sh = ev.target.closest('[data-show]');
    if (sh){ const m=document.getElementById('m-'+sh.dataset.show); m.hidden=!m.hidden; sh.textContent=m.hidden?'Показать образец и чек-лист':'Скрыть образец'; return; }
    const b = ev.target.closest('.opt'); if (!b) return;
    const key=b.dataset.k, {it}=items[key], ok=it.a.includes(b.dataset.v);
    document.querySelectorAll('.opt[data-k="'+key+'"]').forEach(x=>x.classList.remove('ok','no'));
    b.classList.add(ok?'ok':'no'); show(key, ok, false);
  });
  document.getElementById('app').addEventListener('submit', ev => {
    ev.preventDefault(); const f=ev.target, key=f.dataset.k, inp=f.querySelector('input'), {it}=items[key];
    const v=norm(inp.value); if(!v) return;
    const ok = it.a.some(a=>norm(a)===v), dia = !ok && it.a.some(a=>plain(a)===plain(v));
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no'); show(key, ok, dia);
  });

})();
</script>
